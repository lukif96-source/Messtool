<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root { --bg: #05080f; --surface: #0c1220; --panel: #111827; --border: rgba(255,255,255,0.08); --green: #9fc131; --text: #f0f4f8; --muted: #64748b; }
body.sun-mode { --bg: #ffffff; --surface: #f1f5f9; --panel: #f8fafc; --border: #cbd5e1; --green: #4d7c0f; --text: #0f172a; --muted: #475569; }
body.sun-mode .sp-inp { background: #ffffff; color: #0f172a; border-color: #94a3b8; font-weight: 700; }
body.sun-mode #toolbar, body.sun-mode .mobile-bottom-bar { background: rgba(255,255,255,0.96); border-color: #cbd5e1; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

.wrap { max-width: 1360px; margin: 0 auto; padding: 12px 12px 120px; }

/* DASHBOARD */
.dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
@media (max-width: 768px){ .dashboard { grid-template-columns: repeat(2, 1fr); } }
.kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; position: relative; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--green), transparent); }
.kpi-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.kpi-value { font-size: 1.4rem; font-weight: 900; color: var(--text); line-height: 1; }
.kpi-unit { font-size: 0.72rem; color: var(--green); margin-left: 2px; }

/* TOOLBAR */
#toolbar {
  position: sticky; top: 0; z-index: 40; background: rgba(17,24,39,0.94); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-weight: 700; cursor: pointer; border: none; border-radius: 8px; padding: 7px 11px; font-size: 0.75rem; transition: all 0.15s; min-height: 38px; }
.btn-green { background: linear-gradient(135deg, #a8cc35, #7a9420); color: #061200; font-weight: 900; }
.btn-blue  { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
.btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; }
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* TABS */
.wr-filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.wr-filter-bar::-webkit-scrollbar { display: none; }
.wr-tab { flex: 0 0 auto; background: var(--panel); border: 1px solid var(--border); color: var(--muted); font-size: 0.72rem; font-weight: 700; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.wr-tab.active { background: var(--green); color: #061200; border-color: var(--green); }

/* TABLES */
.wr-block { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
.wr-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; background: linear-gradient(135deg, rgba(159,193,49,0.08) 0%, transparent 60%); border-bottom: 1px solid rgba(159,193,49,0.15); flex-wrap: wrap; }
.wr-num { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; background: var(--green); color: #061200; padding: 2px 7px; border-radius: 5px; }
.wr-kpis { font-size: 0.75rem; color: var(--muted); font-weight: 600; }

table.mt { width: 100%; border-collapse: collapse; }
table.mt thead th { padding: 8px 6px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: #64748b; background: rgba(0,0,0,0.25); text-align: center; white-space: nowrap; }
table.mt td { padding: 5px 6px; font-size: 0.78rem; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; vertical-align: middle; }
table.mt tbody tr:hover { background: rgba(159,193,49,0.03); }
table.mt tbody tr.mppt-div { border-top: 1.5px solid rgba(159,193,49,0.18); }
table.mt tbody tr.row-nein { opacity: 0.25; }

.string-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--green); }
.pwr-cell { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--green); }
.plan-badge { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); color: #94a3b8; font-family: 'JetBrains Mono', monospace; }
.plan-badge-green { background: rgba(159,193,49,0.12); color: #a8cc35; border: 1px solid rgba(159,193,49,0.25); }

.sp-inp { background: rgba(5,8,15,0.8); border: 1px solid rgba(100,116,139,0.25); border-radius: 6px; padding: 4px 6px; color: var(--text); font-size: 0.8rem; text-align: center; outline: none; width: 100%; }
.sp-inp:focus { border-color: var(--green); }
.sp-inp-gak { color: #a8cc35; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

.tog-wrap { display: inline-flex; background: rgba(0,0,0,0.4); border-radius: 6px; padding: 2px; }
.tog { padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; border: none; cursor: pointer; background: transparent; color: #475569; }
.tog.on-ja  { background: rgba(159,193,49,0.25); color: #a8cc35; }
.tog.on-nei { background: rgba(100,116,139,0.25); color: #94a3b8; }

#toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(120%); background: #0f172a; border: 1px solid var(--green); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; transition: transform 0.3s; z-index: 9999; }
#toast.show { transform: translateX(-50%) translateY(0); }

/* MOBILE KACHEL LAYOUT */
@media (max-width: 800px) {
  table.mt, table.mt tbody, table.mt tr, table.mt td { display: block; width: 100%; }
  table.mt thead { display: none; }
  table.mt tbody tr { border: 1px solid var(--border); border-radius: 10px; margin: 10px; background: rgba(255,255,255,0.02); overflow: hidden; width: calc(100% - 20px); }
  table.mt tbody tr.mppt-div { border-top: 3px solid rgba(159,193,49,0.3); margin-top: 18px; }
  table.mt td { display: flex; align-items: center; justify-content: space-between; text-align: right; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  table.mt td::before { content: attr(data-label); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--muted); text-align: left; }
  table.mt td:first-child { background: rgba(159,193,49,0.06); padding: 10px 12px; }
  table.mt td:first-child::before { display: none; }
  .sp-inp { max-width: 130px; text-align: right; }
  td.col-note { flex-direction: column; align-items: flex-start; gap: 4px; }
  td.col-note .sp-inp { max-width: 100%; text-align: left; }
}

@media print {
  body { background: #fff !important; color: #000 !important; font-size: 8pt; }
  .no-print, .wr-filter-bar { display: none !important; }
  .wr-block { border: 1px solid #cbd5e1 !important; break-inside: avoid; display: block !important; margin-bottom: 15px; }
  table.mt { width: 100%; display: table !important; }
  table.mt thead { display: table-header-group !important; }
  table.mt tr { display: table-row !important; }
  table.mt td, table.mt th { display: table-cell !important; padding: 5px; border: 1px solid #94a3b8; }
  table.mt tbody tr.row-nein { display: none !important; }
  table.mt td::before { display: none !important; }
  .sp-inp, .tog-wrap { display: none !important; }
  .print-cell { display: inline !important; font-weight: bold; }
}

// FACTORY PROJEKT KONFIGURATION (LÄDT GENAU DAS GÜLTIGE ARRAY)
function loadFreshMatrix(){
  const pr = {
    id: "PV_MAN_P52",
    standort: "PV MAN P52",
    pruefer: "Christoph Huber",
    modulWp: 465,
    mppts: [12,12,12,12,12,12]
  };

  pr.inverters = [1,2,3,4,5,6].map(wr => {
    const arr = [];
    for(let m = 1; m <= 12; m++){
      for(let s = 1; s <= 2; s++){
        const fid = `${wr}.${m}.${s}`;
        const template = SLD_PLAN[fid] || { planName: "", gak: `GAK ${wr}.${m <= 6 ? '1':'2'}`, mod: 0, stat: "NEIN", note: "" };
        arr.push({
          mppt: m,
          in: s,
          planName: template.planName,
          planGak: template.gak,
          planMod: template.mod,
          planStat: template.stat,
          planNote: template.note,
          gak: template.gak,
          mod: template.mod,  // <<< Dieser Parameter zwingt die exakten "Modul" Anzahlen rein
          stat: template.stat, // <<< Erzwingt JA bei echten Strings, und "NEIN" bei freigelassenen .2 !
          note: template.note,
          uoc: "", isc: "", riso: ""
        });
      }
    }
    return { wr: wr, name: `SMA Sunny Tripower 125 (WR ${wr})`, strings: arr };
  });

  return pr;
}

let PROJECT = loadFreshMatrix();

// EXTREMER RESET (Überbügelt ALLES - lokal und Remote - mit den Basiswerten)
async function factoryResetCloud(){
  if(!confirm("Achtung: Dies setzt PV MAN P52 im kompletten Firmennetz (Büro und Cloud) sofort wieder in den Urzustand des THE CONSULTING-Montageplans zurück. Alle alten, verschobenen Cloud-Speicherstände verschwinden damit! Bist du dir sicher?")) return;
  
  localStorage.removeItem('sp_local_backup');
  PROJECT = loadFreshMatrix(); // Reset App
  renderTables();
  
  if(!supabaseClient) return toast('Lokaler Reset ok - Für Cloud-Reset bitte erst Verbindung herstellen');

  try {
    await supabaseClient.from('pv_projects').upsert({
      id: "PV_MAN_P52",
      name: "PV MAN P52",
      pruefer: "Christoph Huber",
      modul_wp: 465,

}


// APP BERECHNUNGS LOGIK 
function renderTables(){
  const container = g('tables');

    let htmlTrs = '';

    inv.strings.forEach(s => {
      let fID = `${inv.wr}.${s.mppt}.${s.in}`;
      let divider = (currMPPT !== -1 && currMPPT !== s.mppt) ? "mppt-div" : "";
      currMPPT = s.mppt;
      
      let rowGreyed = (s.stat === 'NEIN') ? 'row-nein' : '';
      let activePwr = (s.stat === 'JA' && s.mod > 0) ? ((s.mod * PROJECT.modulWp)/1000).toFixed(2) : "0.00";
      
      let planPille = (s.planStat === "JA") 
          ? `<span class="plan-badge plan-badge-green">${s.planName||'-'} &middot; ${s.planMod}M</span>` 
          : `<span class="plan-badge">-- FREI --</span>`;

      htmlTrs += `
        <tr id="r_${fID}" class="${divider} ${rowGreyed}">
          <td data-label="Klemme (Ist)" style="text-align:left;padding-left:14px;"><span class="string-id">${fID}</span> <span style="font-size:0.6rem;color:#64748b;">M${s.mppt}.${s.in}</span></td>
          <td data-label="Planung (Soll)" class="no-print" style="text-align:left;">${planPille}</td>
          <td data-label="GAK (Ist)">
            <input type="text" id="g_${fID}" value="${s.gak}" class="sp-inp sp-inp-gak" style="width:70px;">
          </td>
          <td data-label="Aktiv" class="no-print">
            <div class="tog-wrap">
              <button id="tj_${fID}" class="tog ${s.stat==='JA'?'on-ja':''}" onclick="setBool('${fID}','JA')">JA</button>
              <button id="tn_${fID}" class="tog ${s.stat==='NEIN'?'on-nei':''}" onclick="setBool('${fID}','NEIN')">NEIN</button>
            </div>
            <input type="hidden" id="st_${fID}" value="${s.stat}">
          </td>
          <td data-label="Module">

          <td data-label="Uoc (V)"><input type="text" inputmode="decimal" id="uo_${fID}" value="${s.uoc||''}" placeholder="V" class="sp-inp" style="width:58px;"></td>
          <td data-label="Isc (A)"><input type="text" inputmode="decimal" id="is_${fID}" value="${s.isc||''}" placeholder="A" class="sp-inp" style="width:58px;"></td>

    wrap.innerHTML = `
      <div class="wr-head">

        <div class="wr-kpis"><span id="wm_${inv.wr}">0</span> Module &middot; <span id="wp_${inv.wr}" style="color:var(--green);">0.00</span> kWp</div>

function setBool(id, choice){
  g(`st_${id}`).value = choice;
  if(choice === "JA"){ g(`tj_${id}`).classList.add("on-ja"); g(`tn_${id}`).classList.remove("on-nei"); g(`r_${id}`).classList.remove("row-nein"); }
  else { g(`tj_${id}`).classList.remove("on-ja"); g(`tn_${id}`).classList.add("on-nei"); g(`r_${id}`).classList.add("row-nein"); }
  refreshGlobalKpis();
}

function applyModuleSync(fID, amount){
  // Ermittelt partner Klemme 5.12.1 <-> 5.12.2 (Gleiche MPPT logik!)
  let ps = fID.split(".");
  let partnerNum = (ps[2]==='1') ? '2' : '1';
  let partnerId = `${ps[0]}.${ps[1]}.${partnerNum}`;

  let stEl = g(`st_${partnerId}`);
  let pEl = g(`m_${partnerId}`);
  if(pEl && stEl && stEl.value==='JA'){
    pEl.value = amount;
  }
  refreshGlobalKpis();
}

function refreshGlobalKpis(){
  let globalM = 0; let globalP = 0; let sloti = 0;
  
  for(let w = 1; w<=6; w++){
    let wm = 0; let wp = 0;
    for(let mp = 1; mppt <= 12; mp++){
       [1,2].forEach(ii => {
         let fid = `${w}.${mp}.${ii}`;
         let el_s = g(`st_${fid}`);
         if(!el_s) return;
         let val = parseFloat(g(`m_${fid}`).value)||0;
         
         let pt = 0;
         if(el_s.value === "JA") {
            if(val>0){ sloti++; pt=(val*PROJECT.modulWp)/1000; wm+=val; wp+=pt; globalM+=val; globalP+=pt;}
            g(`pw_${fid}`).textContent = val>0 ? pt.toFixed(2): '—';
         } else {
            g(`pw_${fid}`).textContent = '—';
         }
       });
    }
    // Update local inverter head
    let pR_M = g(`wm_${w}`); if(pR_M) pR_M.textContent = wm;
    let pR_P = g(`wp_${w}`); if(pR_P) pR_P.textContent = wp.toFixed(2);
  }
  g("d-mods").textContent = globalM;
  g("d-pwr").textContent = globalP.toFixed(2);
  g("d-act").textContent = sloti;
}

// ── MANUAL SYNC MIT DATENSAMMLER  ──
function collectCurrentMeasurements(){
  const obj = {};
  for(let w=1; w<=6; w++){
    for(let m=1; m<=12; m++){
       for(let i=1; i<=2; i++){
          let id = `${w}.${m}.${i}`;
          let gSt = g(`st_${id}`);
          if(gSt){
             obj[id] = {
               stat: gSt.value,
               gak: g(`g_${id}`).value,
               mod: g(`m_${id}`).value,
               uoc: g(`uo_${id}`).value,
               isc: g(`is_${id}`).value,
               riso: g(`ri_${id}`).value,
               note: g(`no_${id}`).value
             }
          }
       }
    }
  }
  return obj;
}

async function pushToCloud(){
  if(!supabaseClient) return;
  toast("☁️ Speichere im Projekt in Cloud...");
  let pd = collectCurrentMeasurements();
  localStorage.setItem("sp_pvm_backup", JSON.stringify(pd));
  try {
     const { error } = await supabaseClient.from('pv_projects').upsert({ id: "PV_MAN_P52", name: "PV MAN P52", pruefer: "Christoph Huber", data: pd, modul_wp: 465 });
     if(error) throw "Net Error";
     toast("✅ Plan & Werte online verriegelt.");
     g("cloud-text").textContent = "Gespeichert!";
     g("cloud-dot").className = "status-dot dot-green";
  }catch(e){ toast("Keine Datenverbindung!"); }
}

async function fetchCloudProject(){
  if(!supabaseClient) return;
  toast("📥 Rufe Serverzustand...");
  try {
    let { data, error } = await supabaseClient.from("pv_projects").select("data").eq("id","PV_MAN_P52").single();
    if(data && data.data) {
        let xms = data.data;
        Object.keys(xms).forEach(ik => {
            let cx = xms[ik];
            if(g(`st_${ik}`)){
                g(`g_${ik}`).value = cx.gak || "";
                g(`m_${ik}`).value = cx.mod || "";
                g(`uo_${ik}`).value = cx.uoc || "";
                g(`is_${ik}`).value = cx.isc || "";
                g(`ri_${ik}`).value = cx.riso || "";
                g(`no_${ik}`).value = cx.note || "";
                setBool(ik, cx.stat||'JA');
            }
        });
        toast("Download beendet - Display aktualisiert");
    } else {
        toast("DB Eintrag leer! Klicke 'Plan-Reset' zum Neustart.");
    }
  }catch(ex){ }
}

function printMontagePlan(){
  let doc = window.open('', '_blank');

  PROJECT.inverters.forEach(w =>{
    let hasActiv = w.strings.filter(e => e.planStat==="JA" || g(`st_${w.wr}.${e.mppt}.${e.in}`)?.value==="JA").length;
    if(hasActiv===0) return;
    printRows += `<tr><td colspan="3" style="font-weight:900; background:#334155; color:#fff; font-size:18pt; padding:15px; border-bottom:3px solid #111;">🔌 ${w.name} - ANSCHLÜSSE BELEGT:</td></tr>`;
    w.strings.forEach(st => {
      let ix = `${w.wr}.${st.mppt}.${st.in}`;
      let cxIsOn = (g(`st_${ix}`).value==="JA");
      if(st.planStat!=="JA" && !cxIsOn) return; 

      // Fallback
      let labelP = st.planName ? `Plan: ${st.planName}` : `FREMD / Nachgerüstet!`;
      let gName = g(`g_${ix}`).value || st.planGak;
      
      printRows += `
      <tr>
         <td style="font-size:15pt;font-weight:800;padding:12px;border:2px solid #64748b;color:#1d4ed8;">${labelP} <br><span style="font-size:10pt;font-weight:400;color:#000;">-> in</span></td>
         <td style="font-size:22pt;font-weight:900;font-family:monospace;border:2px solid #64748b;color:#166534;background:#f0fdf4;">${ix}</td>
         <td style="font-size:16pt;font-weight:800;border:2px solid #64748b;">${gName} <br><span style="font-size:9pt;font-weight:500;">(${st.planMod} Mod)</span></td>
      </tr>`;
    });
  });

  doc.document.write(`
   <html>
    <head><title>Anschluss Plan & Montage MAN</title></head>
    <body onload="window.print()" style="font-family:sans-serif; margin:15px; color:#111;">
      <h1 style="font-size:32px;text-transform:uppercase;">MONTAGE UND ANSCHLUSS VOR ORT - WR.KLEMMEN:</h1>
      <p style="font-size:14pt;">BvH PV MAN P52 - Bitte strikt an Wechselrichterbeschriftung (Eingang M1.1 bis M12.2) stecken.</p>
      <table style="width:100%;text-align:center;border-collapse:collapse;">${printRows}</table>
    </body>
   </html>
  `);
  doc.document.close();
}
