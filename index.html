<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>SOLPRO | PV Matrix Tool (KISS Edition)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

/* === KISS.AI STYLE VARIABLES === */
:root {
  --bg: #09090b;           /* Very deep dark */
  --surface: #121214;      /* Slightly lighter card */
  --panel: #18181b;        /* Elevated panel */
  --border: #27272a;       /* Subtle border */
  --text: #f4f4f5;         /* Crisp white text */
  --muted: #a1a1aa;        /* Muted gray text */
  --accent: #22c55e;       /* Modern vibrant green */
  --accent-glow: rgba(34, 197, 94, 0.15);
  --accent-muted: #15803d;
  
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

body.sun-mode {
  --bg: #fafafa;
  --surface: #ffffff;
  --panel: #f4f4f5;
  --border: #e4e4e7;
  --text: #09090b;
  --muted: #71717a;
  --accent: #16a34a;
  --accent-glow: rgba(22, 163, 74, 0.1);
  --accent-muted: #15803d;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}

/* === UTILITIES & LAYOUT === */
.wrap {
  max-width: 1360px; margin: 0 auto;
  padding: 12px 12px 160px;
  padding-left: max(12px, calc(var(--safe-left) + 12px));
  padding-right: max(12px, calc(var(--safe-right) + 12px));
  padding-bottom: max(160px, calc(var(--safe-bottom) + 160px));
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 600; cursor: pointer; border: 1px solid transparent; border-radius: 8px;
  padding: 8px 14px; font-size: 0.8rem;
  transition: all 0.2s ease;
  min-height: 40px; min-width: 40px;
  user-select: none; -webkit-user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #000; font-weight: 700; box-shadow: 0 4px 12px var(--accent-glow); }
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--panel); border-color: var(--muted); }

.sp-inp {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; color: var(--text);
  font-size: 0.85rem; outline: none; width: 100%;
  transition: border-color 0.2s; min-height: 38px;
}
.sp-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
.sp-inp-center { text-align: center; }

/* === DASHBOARD === */
.dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi-card { 
  background: var(--surface); border: 1px solid var(--border); 
  border-radius: 12px; padding: 16px; 
  display: flex; flex-direction: column; gap: 4px;
}
.kpi-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
.kpi-value { font-size: 1.5rem; font-weight: 800; color: var(--text); line-height: 1; }
.kpi-unit { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-left: 2px; }

/* === STICKY WR BLOCKS === */
.wr-block { 
  background: var(--surface); border: 1px solid var(--border); 
  border-radius: 16px; overflow: hidden; margin-bottom: 24px; 
}
.wr-head {
  position: sticky; top: 0; z-index: 25;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 16px;
  background: rgba(18, 18, 20, 0.95);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
body.sun-mode .wr-head { background: rgba(255, 255, 255, 0.95); }

.wr-num { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 800; background: var(--accent); color: #000; padding: 4px 10px; border-radius: 6px; }
.wr-kpis { font-size: 0.8rem; color: var(--muted); font-weight: 600; }

table.mt { width: 100%; border-collapse: collapse; }
table.mt thead th {
  position: sticky; top: 61px; z-index: 20;
  padding: 10px 8px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  color: var(--muted); background: var(--bg); text-align: center; border-bottom: 1px solid var(--border);
}
table.mt td {
  padding: 8px; font-size: 0.85rem;
  border-bottom: 1px solid var(--border);
  text-align: center; vertical-align: middle;
}
table.mt tbody tr:hover { background: var(--panel); }
table.mt tbody tr.mppt-div { border-top: 2px solid var(--border); }
table.mt tbody tr.row-nein { opacity: 0.35; transition: opacity 0.2s; }
table.mt tbody tr.row-nein:hover { opacity: 0.6; }

/* Inactive Filter toggle */
body.hide-inactive table.mt tbody tr.row-nein { display: none !important; }

.string-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent); }
.pwr-cell { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--accent-muted); }

.tog-wrap { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.tog {
  padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700;
  border: none; cursor: pointer; background: transparent; color: var(--muted);
  transition: all 0.2s;
}
.tog.on-ja  { background: var(--accent-glow); color: var(--accent); }
.tog.on-nei { background: var(--panel); color: var(--text); }

/* === MODALS (KISS STYLE) === */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.modal-head h2 { font-size: 1.1rem; font-weight: 700; }
.modal-body { padding: 20px; }

/* MPPT Configurator */
.np-wr-row {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 12px;
}
.np-wr-row label { display: block; font-size: 0.65rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }

/* === SIDEBAR === */
.app-layout { display: flex; min-height: 100vh; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 260px;
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 20px 12px; overflow-y: auto; z-index: 60;
  display: flex; flex-direction: column; gap: 4px;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.sidebar-header { margin-bottom: 24px; padding: 0 8px; }
.sidebar-logo {
  font-size: 1.2rem; font-weight: 900; color: var(--accent);
  letter-spacing: -0.05em; margin-bottom: 4px;
}
.sidebar-subtitle { font-size: 0.75rem; color: var(--muted); }
.sidebar-btn {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 0.85rem;
  cursor: pointer; transition: all 0.2s; border: 1px solid transparent; background: transparent;
}
.sidebar-btn:hover { background: var(--panel); color: var(--text); }
.sidebar-btn .icon { font-size: 1.1rem; }
.main-content { flex: 1; margin-left: 260px; padding: 16px; min-width: 0; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); box-shadow: 4px 0 24px rgba(0,0,0,0.5); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; padding: 10px; }
  table.mt, table.mt tbody, table.mt tr, table.mt td { display: block; width: 100%; }
  table.mt thead { display: none; }
  table.mt tbody tr { border: 1px solid var(--border); border-radius: 12px; margin: 12px 0; background: var(--bg); padding: 4px 0;}
  table.mt td { display: flex; align-items: center; justify-content: space-between; text-align: right; border-bottom: 1px solid var(--border); }
  table.mt td:last-child { border-bottom: none; }
  table.mt td::before { content: attr(data-label); font-size: 0.7rem; color: var(--muted); flex: 0 0 auto; }
  .sp-inp { max-width: 120px; text-align: right; }
}

/* === FLOATING BAR MOBILE === */
.top-bar-mobile {
  display: none; position: sticky; top: 0; z-index: 50;
  background: rgba(18, 18, 20, 0.85); backdrop-filter: blur(12px);
  padding: 12px; border-bottom: 1px solid var(--border);
  align-items: center; justify-content: space-between; margin-bottom: 16px;
}
@media (max-width: 900px) { .top-bar-mobile { display: flex; } }

#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 100%);
  background: var(--text); color: var(--bg); padding: 12px 24px;
  border-radius: 99px; font-size: 0.85rem; font-weight: 600;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
#toast.show { transform: translate(-50%, 0); }

@media print {
  body { background: #fff !important; color: #000 !important; }
  .no-print, .sidebar { display: none !important; }
  .main-content { margin: 0 !important; padding: 0 !important; }
  .wr-block { break-inside: avoid; border: 1px solid #ccc !important; display: block !important; margin-bottom: 20px; }
  table.mt td, table.mt th { border: 1px solid #ccc !important; padding: 4px; font-size: 9pt; }
  table.mt tbody tr.row-nein { display: none !important; }
}
</style>
</head>
<body>

<div id="toast"></div>

<!-- Mobile Header -->
<div class="top-bar-mobile no-print">
  <div style="font-weight:800; font-size:1.1rem; color:var(--accent);">SOLPRO</div>
  <button class="btn btn-ghost" onclick="toggleSidebar()" style="padding:6px 12px;">☰ Menü</button>
</div>

<aside class="sidebar no-print" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">SOLPRO</div>
    <div class="sidebar-subtitle">Matrix Tool &middot; KISS Edition</div>
  </div>

  <div style="margin-bottom: 20px; padding: 0 8px;">
    <label style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;">Aktuelles Projekt</label>
    <button onclick="openProjectsModal();closeSidebar();" class="btn btn-ghost" style="width:100%; justify-content:space-between; margin-top:4px;">
      <span id="sb-proj-name" style="font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">PV MAN P52</span>
      <span>▼</span>
    </button>
  </div>

  <div style="font-size:0.65rem; font-weight:700; color:var(--muted); text-transform:uppercase; padding:12px 8px 4px;">Ansicht</div>
  <button class="sidebar-btn" id="btn-hide-nein" onclick="toggleHideInactive()">
    <span class="icon">👁️</span><span class="label" id="hide-nein-text">Nur aktive Strings</span>
  </button>
  <button onclick="toggleSunMode();" class="sidebar-btn" id="btn-sun">
    <span class="icon">☀️</span><span class="label">Hell / Dunkel</span>
  </button>

  <div style="font-size:0.65rem; font-weight:700; color:var(--muted); text-transform:uppercase; padding:12px 8px 4px;">Aktionen & Export</div>
  <button onclick="pushCloudDataManually();closeSidebar();" class="sidebar-btn">
    <span class="icon" style="color:#3b82f6;">☁️</span><span class="label">In Cloud sichern</span>
  </button>
  <button onclick="fetchCloudDataManually();closeSidebar();" class="sidebar-btn">
    <span class="icon">📥</span><span class="label">Aus Cloud laden</span>
  </button>
  
  <hr style="border:none; border-top:1px solid var(--border); margin: 12px 8px;">
  
  <button onclick="printBlankMeasurementSheet();closeSidebar();" class="sidebar-btn" style="color:var(--text); font-weight:600;">
    <span class="icon">📝</span><span class="label">Messprotokoll (Blanko PDF)</span>
  </button>
  <button onclick="printWRMontagePlan();closeSidebar();" class="sidebar-btn">
    <span class="icon">📋</span><span class="label">Montageplan (PDF)</span>
  </button>
  <button onclick="doExcel();closeSidebar();" class="sidebar-btn">
    <span class="icon">📊</span><span class="label">Excel Prüfprotokoll</span>
  </button>
</aside>
<div class="sidebar-overlay no-print" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="app-layout">
<div class="main-content">

  <div class="dashboard no-print">
    <div class="kpi-card">
      <div class="kpi-label">Leistung</div>
      <div class="kpi-value"><span id="d-pwr">0.00</span><span class="kpi-unit">kWp</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Module</div>
      <div class="kpi-value" id="d-mods">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Strings belegt</div>
      <div class="kpi-value"><span id="d-act">0</span> <span style="font-size:1rem;color:var(--muted);font-weight:500;">/ <span id="d-tot">0</span></span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Modulstärke</div>
      <div class="kpi-value"><span id="d-wp">465</span><span class="kpi-unit">Wp</span></div>
    </div>
  </div>

  <div id="tables"></div>

</div>
</div>

<!-- PROJECTS MODAL -->
<div id="projects-modal" class="modal-overlay" onclick="closeProjectsModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h2>📁 Projekte</h2>
      <button onclick="closeProjectsModal()" class="btn btn-ghost" style="padding:4px 8px;">✕</button>
    </div>
    <div class="modal-body">
      <div id="proj-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>
      <button onclick="openNewProjectModal()" class="btn btn-primary" style="width:100%;">+ Neues Projekt</button>
    </div>
  </div>
</div>

<!-- NEW PROJECT MODAL -->
<div id="newproj-modal" class="modal-overlay" onclick="closeNewProjectModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h2>✨ Neues Projekt</h2>
      <button onclick="closeNewProjectModal()" class="btn btn-ghost" style="padding:4px 8px;">✕</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:0.7rem;color:var(--muted);margin-bottom:4px;">Projektname</label>
        <input type="text" id="np-name" placeholder="z.B. Logistikzentrum Nord" class="sp-inp">
      </div>
      <div style="display:flex;gap:12px;margin-bottom:16px;">
        <div style="flex:1;">
          <label style="display:block;font-size:0.7rem;color:var(--muted);margin-bottom:4px;">Wp pro Modul</label>
          <input type="number" id="np-wp" value="465" class="sp-inp">
        </div>
        <div style="flex:1;">
          <label style="display:block;font-size:0.7rem;color:var(--muted);margin-bottom:4px;">Anzahl WR</label>
          <input type="number" id="np-wr-count" value="1" min="1" max="20" class="sp-inp" oninput="renderNPWRPlan()">
        </div>
      </div>
      
      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:0.7rem;color:var(--muted);margin-bottom:8px;font-weight:700;">Hardware Konfiguration (pro WR)</label>
        <div id="np-wr-plan-list"></div>
      </div>

      <div style="display:flex;gap:12px;">
        <button onclick="closeNewProjectModal()" class="btn btn-ghost" style="flex:1;">Abbrechen</button>
        <button onclick="doCreateNewProject()" class="btn btn-primary" style="flex:1;">Projekt erstellen</button>
      </div>
    </div>
  </div>
</div>

<script>
let hideInactive = false;

function toast(msg, ms=3000){
  const t = document.getElementById('toast'); 
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function toggleSunMode(){ document.body.classList.toggle('sun-mode'); }
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}
function toggleHideInactive(){
  hideInactive = !hideInactive;
  document.body.classList.toggle('hide-inactive', hideInactive);
  const btn = document.getElementById('btn-hide-nein');
  if(btn) btn.style.color = hideInactive ? 'var(--accent)' : '';
  document.getElementById('hide-nein-text').textContent = hideInactive ? 'Alle Strings anzeigen' : 'Nur aktive Strings';
  toast(hideInactive ? 'Inaktive Strings ausgeblendet' : 'Alle Strings eingeblendet');
}

// === DATA MODEL ===
const STORAGE_KEYS = { projects: 'solpro_projects_v2', data: 'solpro_data_v2', current: 'solpro_curr_v2' };

let PROJECTS = {};
let CURRENT_PROJECT_ID = null;
let APP_STATE = {};

// Legacy fallback Plan
const STRICT_CHRONO_PLAN = {
  1: [ { p: 1, m: 23, g: 1 }, { p: 2, m: 23, g: 1 } ] // stark gekürzt für Demo
};
const DEFAULT_PROJECTS = {
  PV_MAN_P52: { id: 'PV_MAN_P52', name: 'PV MAN P52 (Legacy)', model_wp: 465, plan: STRICT_CHRONO_PLAN }
};

function initProjects(){
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEYS.projects) || '{}');
    PROJECTS = Object.keys(stored).length > 0 ? stored : JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
  } catch(e){ PROJECTS = JSON.parse(JSON.stringify(DEFAULT_PROJECTS)); }

  CURRENT_PROJECT_ID = localStorage.getItem(STORAGE_KEYS.current) || Object.keys(PROJECTS)[0];
  if(!PROJECTS[CURRENT_PROJECT_ID]) CURRENT_PROJECT_ID = Object.keys(PROJECTS)[0];
  
  loadCurrentProjectData();
}

function getCurrentProject(){ return PROJECTS[CURRENT_PROJECT_ID] || null; }
function getCurrentPlan(){ return getCurrentProject() ? getCurrentProject().plan : {}; }
function getCurrentWp(){ return getCurrentProject() ? getCurrentProject().model_wp : 465; }

function generateState(plan){
  const result = {};
  if(!plan) return result;
  
  Object.keys(plan).forEach(wr => {
    const wrData = plan[wr];
    const isLegacy = Array.isArray(wrData);
    
    const mppts = isLegacy ? 12 : (wrData.mppts || 12);
    const inputs = isLegacy ? 2 : (wrData.inputs || 2);
    const defMods = isLegacy ? 0 : (wrData.defaultMods || 0);
    
    if(isLegacy) {
      // Compatibility mapping (simplified)
      for(let m=1; m<=12; m++) {
        for(let s=1; s<=2; s++) {
          result[`${wr}.${m}.${s}`] = { planName: "", gak: `GAK ${wr}`, mod: 0, stat: "NEIN", note: "" };
        }
      }
      wrData.forEach((item, idx) => {
        let m = Math.floor(idx/2) + 1;
        let s = (idx%2) + 1;
        if(m<=12) {
          result[`${wr}.${m}.${s}`] = { planName: `STR ${item.p}`, gak: `GAK ${wr}.${item.g}`, mod: item.m, stat: "JA", note: "" };
        }
      });
    } else {
      // New Dynamic Hardware Mapping
      for(let m=1; m<=mppts; m++){
        for(let s=1; s<=inputs; s++){
          const isAct = defMods > 0;
          result[`${wr}.${m}.${s}`] = { 
            planName: "", gak: `GAK ${wr}`, mod: isAct ? defMods : 0, 
            stat: isAct ? "JA" : "NEIN", note: "", uoc:"", isc:"", riso:"" 
          };
        }
      }
    }
  });
  return result;
}

function loadCurrentProjectData(){
  if(!CURRENT_PROJECT_ID) return;
  APP_STATE = generateState(getCurrentPlan());
  try {
    const allData = JSON.parse(localStorage.getItem(STORAGE_KEYS.data) || '{}');
    const projData = allData[CURRENT_PROJECT_ID] || {};
    Object.keys(projData).forEach(k => {
      if(APP_STATE[k]){
        APP_STATE[k] = { ...APP_STATE[k], ...projData[k] };
      }
    });
  } catch(e){}
  updateUI();
}

function updateUI() {
  const p = getCurrentProject();
  document.getElementById('sb-proj-name').textContent = p ? p.name : '—';
  document.getElementById('d-wp').textContent = getCurrentWp();
  renderMatrix();
}

function renderMatrix(){
  const wp = getCurrentWp();
  const plan = getCurrentPlan();
  const container = document.getElementById('tables');
  container.innerHTML = '';
  
  let totMods = 0, totPwr = 0, totActive = 0, totSlots = 0;

  Object.keys(plan).sort((a,b)=>a-b).forEach(wr => {
    const wrData = plan[wr];
    const isLegacy = Array.isArray(wrData);
    const mppts = isLegacy ? 12 : (wrData.mppts || 12);
    const inputs = isLegacy ? 2 : (wrData.inputs || 2);
    
    const bl = document.createElement('div');
    bl.className = 'wr-block';
    
    let rowsHtml = '';
    let wrMods = 0, wrPwr = 0, activeStrings = 0;

    for(let m = 1; m <= mppts; m++){
      for(let s = 1; s <= inputs; s++){
        const id = `${wr}.${m}.${s}`;
        if(!APP_STATE[id]) continue;
        totSlots++;
        const item = APP_STATE[id];
        const isJa = item.stat === 'JA';
        const pwr = (isJa && item.mod > 0) ? ((item.mod * wp)/1000).toFixed(2) : '—';
        
        if(isJa && item.mod > 0) {
           wrMods += item.mod; totMods += item.mod;
           wrPwr += (item.mod * wp)/1000; totPwr += (item.mod * wp)/1000;
           activeStrings++; totActive++;
        }

        rowsHtml += `
          <tr id="row-${id}" class="${(s===1 && m>1) ? 'mppt-div' : ''} ${!isJa ? 'row-nein' : ''}">
            <td data-label="Klemme"><span class="string-id">${id}</span></td>
            <td data-label="GAK"><input type="text" id="gak-${id}" value="${item.gak}" class="sp-inp sp-inp-center" oninput="saveData('${id}', 'gak', this.value)"></td>
            <td data-label="Aktiv" class="no-print">
              <div class="tog-wrap">
                <button id="tja-${id}" class="tog ${isJa?'on-ja':''}" onclick="setStat('${id}','JA')">JA</button>
                <button id="tnei-${id}" class="tog ${!isJa?'on-nei':''}" onclick="setStat('${id}','NEIN')">NEIN</button>
              </div>
            </td>
            <td data-label="Module"><input type="number" id="mod-${id}" value="${item.mod||''}" class="sp-inp sp-inp-center" oninput="saveData('${id}', 'mod', this.value); updateKPIs();"></td>
            <td data-label="kWp" class="pwr-cell" id="pw-${id}">${pwr}</td>
            <td data-label="Uoc"><input type="text" id="uoc-${id}" value="${item.uoc||''}" class="sp-inp sp-inp-center" oninput="saveData('${id}', 'uoc', this.value)"></td>
            <td data-label="Isc"><input type="text" id="isc-${id}" value="${item.isc||''}" class="sp-inp sp-inp-center" oninput="saveData('${id}', 'isc', this.value)"></td>
            <td data-label="Riso"><input type="text" id="riso-${id}" value="${item.riso||''}" class="sp-inp sp-inp-center" oninput="saveData('${id}', 'riso', this.value)"></td>
            <td data-label="Notiz"><input type="text" id="note-${id}" value="${item.note||''}" class="sp-inp" oninput="saveData('${id}', 'note', this.value)"></td>
          </tr>`;
      }
    }

    bl.innerHTML = `
      <div class="wr-head">
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="wr-num">WR ${wr}</span>
          <span class="wr-kpis">${activeStrings} Strings &middot; ${mppts} MPPTs</span>
        </div>
        <div class="wr-kpis"><strong style="color:var(--accent);">${wrPwr.toFixed(2)} kWp</strong></div>
      </div>
      <div style="overflow-x:auto;">
        <table class="mt">
          <thead><tr>
            <th style="width:10%;">Klemme</th><th style="width:10%;">GAK</th>
            <th class="no-print" style="width:10%;">Aktiv</th>
            <th style="width:10%;">Mods</th><th style="width:10%;">kWp</th>
            <th style="width:10%;">Uoc(V)</th><th style="width:10%;">Isc(A)</th>
            <th style="width:10%;">Riso(MΩ)</th><th style="width:20%;text-align:left;">Bemerkung</th>
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>`;
    container.appendChild(bl);
  });
  
  document.getElementById('d-pwr').textContent = totPwr.toFixed(2);
  document.getElementById('d-mods').textContent = totMods;
  document.getElementById('d-act').textContent = totActive;
  document.getElementById('d-tot').textContent = totSlots;
}

function saveData(id, field, val) {
  if(!APP_STATE[id]) return;
  if(field==='mod') APP_STATE[id][field] = parseFloat(val)||0;
  else APP_STATE[id][field] = val;
  
  if(field==='mod' || field==='stat') {
    const isJa = APP_STATE[id].stat === 'JA';
    const row = document.getElementById(`row-${id}`);
    const pw = document.getElementById(`pw-${id}`);
    if(row) row.className = row.className.replace('row-nein','') + (!isJa ? ' row-nein' : '');
    if(pw) pw.textContent = (isJa && APP_STATE[id].mod>0) ? ((APP_STATE[id].mod * getCurrentWp())/1000).toFixed(2) : '—';
  }
  
  // Persist
  try {
    const allData = JSON.parse(localStorage.getItem(STORAGE_KEYS.data) || '{}');
    allData[CURRENT_PROJECT_ID] = APP_STATE;
    localStorage.setItem(STORAGE_KEYS.data, JSON.stringify(allData));
  } catch(e){}
}

function setStat(id, st) {
  saveData(id, 'stat', st);
  const ja = document.getElementById(`tja-${id}`);
  const nei = document.getElementById(`tnei-${id}`);
  if(st==='JA'){ ja.className='tog on-ja'; nei.className='tog'; }
  else { nei.className='tog on-nei'; ja.className='tog'; }
  updateKPIs();
}

function updateKPIs(){ renderMatrix(); } // Full re-render for simplicity in this demo to keep KPIs synced perfectly

// === NEW PROJECT LOGIC ===

function openProjectsModal(){
  const list = document.getElementById('proj-list');
  list.innerHTML = Object.keys(PROJECTS).map(id => `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:12px;">
      <div>
        <div style="font-weight:700;">${id === CURRENT_PROJECT_ID ? '✓ ' : ''}${PROJECTS[id].name}</div>
        <div style="font-size:0.7rem;color:var(--muted);">${Object.keys(PROJECTS[id].plan).length} WR &middot; ${PROJECTS[id].model_wp} Wp</div>
      </div>
      <button class="btn btn-ghost" onclick="selectProject('${id}')">Öffnen</button>
    </div>
  `).join('');
  document.getElementById('projects-modal').classList.add('show');
}
function closeProjectsModal(e){ if(!e || e.target===e.currentTarget) document.getElementById('projects-modal').classList.remove('show'); }
function selectProject(id){
  CURRENT_PROJECT_ID = id;
  localStorage.setItem(STORAGE_KEYS.current, id);
  loadCurrentProjectData();
  closeProjectsModal();
  toast('Projekt geladen');
}

function openNewProjectModal(){
  document.getElementById('np-name').value = '';
  renderNPWRPlan();
  closeProjectsModal();
  document.getElementById('newproj-modal').classList.add('show');
}
function closeNewProjectModal(e){ if(!e || e.target===e.currentTarget) document.getElementById('newproj-modal').classList.remove('show'); }

function renderNPWRPlan(){
  const count = parseInt(document.getElementById('np-wr-count').value)||1;
  let html = '';
  for(let wr=1; wr<=count; wr++){
    html += `
      <div class="np-wr-row">
        <div style="font-weight:800; font-size:0.8rem; margin-bottom:10px; color:var(--accent);">Wechselrichter ${wr}</div>
        <div style="display:flex; gap:12px;">
          <div style="flex:1;"><label>MPPTs</label><input type="number" id="np-mppts-${wr}" value="12" class="sp-inp sp-inp-center"></div>
          <div style="flex:1;"><label>Eingänge/MPPT</label><input type="number" id="np-inputs-${wr}" value="2" class="sp-inp sp-inp-center"></div>
          <div style="flex:1;"><label>Mods/String (Opt.)</label><input type="number" id="np-mods-${wr}" placeholder="Leer" class="sp-inp sp-inp-center"></div>
        </div>
      </div>`;
  }
  document.getElementById('np-wr-plan-list').innerHTML = html;
}

function doCreateNewProject(){
  const name = document.getElementById('np-name').value.trim();
  const wp = parseInt(document.getElementById('np-wp').value)||465;
  const count = parseInt(document.getElementById('np-wr-count').value)||1;
  if(!name) return toast('Bitte Namen eingeben');
  
  let id = name.replace(/[^a-zA-Z0-9]/g, '_');
  if(PROJECTS[id]) id += '_' + Date.now();
  
  const plan = {};
  for(let wr=1; wr<=count; wr++){
    plan[wr] = {
      mppts: parseInt(document.getElementById(`np-mppts-${wr}`).value)||1,
      inputs: parseInt(document.getElementById(`np-inputs-${wr}`).value)||1,
      defaultMods: parseInt(document.getElementById(`np-mods-${wr}`).value)||0
    };
  }
  
  PROJECTS[id] = { id, name, model_wp: wp, plan };
  localStorage.setItem(STORAGE_KEYS.projects, JSON.stringify(PROJECTS));
  closeNewProjectModal();
  selectProject(id);
  toast('Projekt erstellt');
}

function printBlankMeasurementSheet(){
  const proj = getCurrentProject();
  if(!proj) return;
  const dateStr = new Date().toLocaleDateString('de-AT');
  
  let win = window.open('', '_blank');
  let pagesHtml = '';

  Object.keys(proj.plan).sort((a,b)=>a-b).forEach(wr => {
    let rowsHtml = '';
    
    // Wir iterieren über ALLE Slots dieses WRs aus dem APP_STATE
    const wrKeys = Object.keys(APP_STATE).filter(k => k.startsWith(`${wr}.`)).sort((a,b) => {
      let pA = a.split('.').map(Number), pB = b.split('.').map(Number);
      if(pA[1] !== pB[1]) return pA[1] - pB[1];
      return pA[2] - pB[2];
    });

    wrKeys.forEach(id => {
      const item = APP_STATE[id];
      if(item.stat !== 'JA') return; // Nur aktive für das Messblatt
      
      rowsHtml += `
        <tr>
          <td style="padding:12px; border:1px solid #000; font-weight:bold; font-size:12pt; text-align:center;">${id}</td>
          <td style="padding:12px; border:1px solid #000; font-size:11pt; text-align:center;">${item.gak || ''}</td>
          <td style="padding:12px; border:1px solid #000; font-size:11pt; text-align:center;">${item.mod || ''}</td>
          <td style="padding:12px; border:1px solid #000; border-right:2px solid #000;"></td>
          <td style="padding:12px; border:1px solid #000;"></td>
          <td style="padding:12px; border:1px solid #000; border-right:2px solid #000;"></td>
          <td style="padding:12px; border:1px solid #000; text-align:center;">
             <div style="display:inline-block; width:16px; height:16px; border:1px solid #000; margin-right:8px;"></div> Ja
             <div style="display:inline-block; width:16px; height:16px; border:1px solid #000; margin-left:12px; margin-right:8px;"></div> Nein
          </td>
          <td style="padding:12px; border:1px solid #000;"></td>
        </tr>`;
    });

    if(rowsHtml !== '') {
      pagesHtml += `
        <div style="page-break-after: always; padding-bottom: 20px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; border-bottom:3px solid #000; padding-bottom:10px;">
            <div>
              <h1 style="margin:0 0 5px 0; font-size:20pt; font-family:sans-serif;">Messprotokoll DC-Strings</h1>
              <div style="font-size:12pt; font-family:sans-serif; font-weight:bold;">Projekt: ${proj.name} &middot; Wechselrichter: ${wr}</div>
            </div>
            <div style="font-size:10pt; font-family:sans-serif; text-align:right;">
              Datum: ${dateStr}<br>
              Geprüft von: _______________________
            </div>
          </div>
          
          <div style="display:flex; gap:20px; margin-bottom:20px; font-family:sans-serif; font-size:11pt;">
             <div style="flex:1; border:1px solid #000; padding:10px;">Einstrahlung (W/m²): </div>
             <div style="flex:1; border:1px solid #000; padding:10px;">Modultemperatur (°C): </div>
             <div style="flex:1; border:1px solid #000; padding:10px;">Messgerät: </div>
          </div>

          <table style="width:100%; border-collapse:collapse; font-family:sans-serif;">
            <thead>
              <tr style="background:#eee;">
                <th style="padding:12px; border:1px solid #000; width:10%;">Klemme</th>
                <th style="padding:12px; border:1px solid #000; width:10%;">GAK</th>
                <th style="padding:12px; border:1px solid #000; width:8%;">Mods</th>
                <th style="padding:12px; border:1px solid #000; border-right:2px solid #000; width:12%;">Uoc [V]</th>
                <th style="padding:12px; border:1px solid #000; width:12%;">Isc [A]</th>
                <th style="padding:12px; border:1px solid #000; border-right:2px solid #000; width:12%;">Riso [MΩ]</th>
                <th style="padding:12px; border:1px solid #000; width:18%;">Polarität i.O.</th>

          <div style="margin-top:40px; display:flex; justify-content:space-between; font-family:sans-serif; font-size:10pt;">
             <div style="border-top:1px solid #000; padding-top:5px; width:250px; text-align:center;">Unterschrift Prüfer</div>

          </div>

    }
  });

  if(pagesHtml === '') {
    toast('Keine aktiven Strings zum Drucken gefunden!');
    win.close();
    return;
  }

  win.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Messprotokoll ${proj.name}</title>
      <style>
        body { font-family: Arial, sans-serif; color: #000; background: #fff; margin:0; padding:20mm; }
