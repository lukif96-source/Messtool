<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SOLPRO | PV MAN P52 (Mobile Pro)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --bg: #05080f;
  --surface: #0c1220;
  --panel: #111827;
  --border: rgba(255,255,255,0.08);
  --green: #9fc131;
  --text: #f0f4f8;
  --muted: #64748b;
}

/* HELL-MODUS FÜR PRALLE SONNE AUF DEM DACH */
body.sun-mode {
  --bg: #ffffff;
  --surface: #f1f5f9;
  --panel: #f8fafc;
  --border: #cbd5e1;
  --green: #4d7c0f;
  --text: #0f172a;
  --muted: #475569;
}
body.sun-mode .sp-inp {
  background: #ffffff;
  color: #0f172a;
  border-color: #94a3b8;
  font-weight: 700;
}
body.sun-mode #toolbar, body.sun-mode .mobile-bottom-bar {
  background: rgba(255,255,255,0.96);
  border-color: #cbd5e1;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1340px; margin: 0 auto; padding: 12px 12px 120px; }

/* DASHBOARD */
.dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
@media (max-width: 768px){ .dashboard { grid-template-columns: repeat(2, 1fr); } }
.kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; position: relative; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--green), transparent); }
.kpi-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.kpi-value { font-size: 1.4rem; font-weight: 900; color: var(--text); line-height: 1; }
.kpi-unit { font-size: 0.72rem; color: var(--green); margin-left: 2px; }

/* TOOLBAR */
#toolbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(17,24,39,0.94); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 12px; flex-wrap: wrap; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  font-family: 'Inter', sans-serif; font-weight: 700; cursor: pointer; border: none;
  border-radius: 8px; padding: 7px 11px; font-size: 0.75rem; transition: all 0.15s; min-height: 38px;
}
.btn-green { background: linear-gradient(135deg, #a8cc35, #7a9420); color: #061200; font-weight: 900; }
.btn-blue  { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
.btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; }
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* WECHSELRICHTER TAB-FILTER */
.wr-filter-bar {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}
.wr-tab {
  flex: 0 0 auto; background: var(--panel); border: 1px solid var(--border);
  color: var(--muted); font-size: 0.72rem; font-weight: 700; border-radius: 8px;
  padding: 6px 12px; cursor: pointer; transition: all 0.15s;
}
.wr-tab.active { background: var(--green); color: #061200; border-color: var(--green); }

/* CLOUD STATUS BADGE */
.cloud-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 0.7rem; font-weight: 700;
  padding: 3px 8px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot-green  { background: #a8cc35; box-shadow: 0 0 8px #a8cc35; }
.dot-yellow { background: #eab308; box-shadow: 0 0 8px #eab308; }
.dot-red    { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

.proj-select {
  background: rgba(5,8,15,0.9); border: 1px solid rgba(159,193,49,0.4);
  color: var(--text); font-weight: 700; font-size: 0.8rem; border-radius: 8px;
  padding: 5px 8px; outline: none; cursor: pointer;
}

/* WR BLOCK & TABLES */
.wr-block { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
.wr-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; background: linear-gradient(135deg, rgba(159,193,49,0.08) 0%, transparent 60%);
  border-bottom: 1px solid rgba(159,193,49,0.15); flex-wrap: wrap;
}
.wr-title-wrap { display: flex; align-items: center; gap: 8px; }
.wr-num { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 700; background: var(--green); color: #061200; padding: 2px 7px; border-radius: 5px; }
.wr-name { font-size: 0.82rem; font-weight: 700; text-transform: uppercase; }

table.mt { width: 100%; border-collapse: collapse; }
table.mt thead th {
  padding: 8px 6px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
  color: #64748b; background: rgba(0,0,0,0.25); text-align: center; white-space: nowrap;
}
table.mt td { padding: 6px 6px; font-size: 0.78rem; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; vertical-align: middle; }
table.mt tbody tr:hover { background: rgba(159,193,49,0.03); }
table.mt tbody tr.mppt-div { border-top: 1.5px solid rgba(159,193,49,0.18); }
table.mt tbody tr.row-nein { opacity: 0.25; }

.string-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--green); }
.pwr-cell { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--green); }

.plan-badge { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.05); color: #94a3b8; font-family: 'JetBrains Mono', monospace; }
.plan-badge-green { background: rgba(159,193,49,0.12); color: #a8cc35; border: 1px solid rgba(159,193,49,0.25); }

.sp-inp {
  background: rgba(5,8,15,0.8); border: 1px solid rgba(100,116,139,0.25);
  border-radius: 6px; padding: 5px 6px; color: var(--text); font-size: 0.82rem; text-align: center; outline: none;
  min-height: 36px;
}
.sp-inp:focus { border-color: var(--green); }
.sp-inp-gak { color: #a8cc35; font-weight: 700; font-family: 'JetBrains Mono', monospace; width: 72px; }

/* TOGGLE */
.tog-wrap { display: inline-flex; background: rgba(0,0,0,0.4); border-radius: 6px; padding: 2px; }
.tog { padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; border: none; cursor: pointer; background: transparent; color: #475569; min-height: 28px; }
.tog.on-ja  { background: rgba(159,193,49,0.25); color: #a8cc35; }
.tog.on-nei { background: rgba(100,116,139,0.25); color: #94a3b8; }

/* SMARTPHONE DAUMEN-BAR (UNTEN) */
.mobile-bottom-bar {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: rgba(17,24,39,0.96); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border); padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  justify-content: space-between; align-items: center; gap: 8px;
}
@media (max-width: 768px){
  .mobile-bottom-bar { display: flex; }
}

#toast {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(120%);
  background: #0f172a; border: 1px solid var(--green); color: #fff; padding: 8px 16px;
  border-radius: 8px; font-size: 0.8rem; font-weight: 600; transition: transform 0.3s; z-index: 9999;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* MODALS */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 12px; backdrop-filter: blur(8px); }
.modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; padding: 18px; max-height: 90vh; overflow-y: auto; }
.sig-box { background: #ffffff; border: 2px dashed #94a3b8; border-radius: 8px; touch-action: none; width: 100%; height: 120px; }

/* PRINT */
@media print {
  body { background: #fff !important; color: #000 !important; font-size: 8pt; }
  .no-print, .mobile-bottom-bar, .wr-filter-bar { display: none !important; }
  .wr-block { break-inside: avoid-page; border: 1px solid #cbd5e1 !important; margin-bottom: 10px; display: block !important; }
  .wr-head { background: #f1f5f9 !important; color: #000 !important; }
  table.mt th { background: #e2e8f0 !important; color: #000 !important; border: 1px solid #94a3b8; }
  table.mt td { border: 1px solid #cbd5e1 !important; color: #000 !important; }
  table.mt tbody tr.row-nein { display: none !important; }
  .sp-inp, .tog-wrap { display: none !important; }
  .print-cell { display: inline !important; font-weight: 700 !important; }

  #pr-sig { display: flex !important; gap: 24px; margin-top: 24px; padding-top: 14px; border-top: 2px solid #334155; break-inside: avoid; }
  .sig-col { flex: 1; text-align: center; }
  .sig-img-container { height: 60px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 4px; }
  .sig-img-container img { max-height: 55px; max-width: 100%; }
  .sig-line { border-bottom: 1.5px solid #000; margin-bottom: 4px; }
  .sig-desc { font-size: 7pt; font-weight: 700; color: #475569; text-transform: uppercase; }
}
#pr-sig { display: none; }
.print-cell { display: none; }
</style>
</head>

<div id="toast"></div>

<!-- MODAL: DIGITALE UNTERSCHRIFT -->

const SB_URL = "https://rcuimtfmjkpxkazbsggj.supabase.co";

const g = id => document.getElementById(id);
let toast_t = null, sync_timeout = null, auto_sync_interval = null;
let supabaseClient = null;

function toast(msg, ms=2600){
  const t = g('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast_t); toast_t = setTimeout(() => t.classList.remove('show'), ms);
}

// SONNENLICHT-MODUS TOGGLE (FÜR HELLEN KONTRAST AUF DEM DACH)
function toggleSunMode(){
  document.body.classList.toggle('sun-mode');
  const isSun = document.body.classList.contains('sun-mode');
  g('btn-sun').textContent = isSun ? '🌙 Dark-Modus' : '☀️ Dach-Modus';
  localStorage.setItem('solpro_sun_mode', isSun ? '1' : '0');
}

// WECHSELRICHTER FILTERN (SCHNELLES SWITCHEN AUF DEM SMARTPHONE)
function filterInverter(wrNum, btnEl){
  document.querySelectorAll('.wr-tab').forEach(t => t.classList.remove('active'));
  if(btnEl) btnEl.classList.add('active');

  const blocks = document.querySelectorAll('.wr-block');
  blocks.forEach((bl, idx) => {
    if(wrNum === 0 || idx + 1 === wrNum){
      bl.style.display = 'block';
    } else {
      bl.style.display = 'none';
    }
  });
}

function createDefaultProject(id="PV_MAN_P52", name="PV MAN P52", mppts=[12,12,12,12,12,12], modWp=465, tech="Christoph Huber / Sven"){
  return {
    id: id,
    standort: name,
    sub: `${name} · ${modWp} Wp`,
    pruefer: tech,
    modulWp: modWp,
    mppts: mppts,
    signatures: {
      techName: tech,
      techSig: "",
      clientName: "MAN München",
      clientSig: "",
      date: new Date().toLocaleDateString('de-AT')
    },
    inverters: mppts.map((mpptCount, idx) => {
      const wr = idx + 1;
      const strings = [];
      for(let m = 1; m <= mpptCount; m++){
        for(let s = 1; s <= 2; s++){
          const fullId = `${wr}.${m}.${s}`;
          const plan = (id === "PV_MAN_P52") ? (SLD_PLAN[fullId] || { gak: `GAK ${wr}.${m <= 6 ? '1' : '2'}`, mod: 0, stat: "NEIN", note: "" }) : { gak: `GAK ${wr}.${m <= Math.ceil(mpptCount/2) ? '1' : '2'}`, mod: 0, stat: "JA", note: "" };
          strings.push({
            mppt: m,
            in: s,
            planGak: plan.gak,
            planMod: plan.mod,
            planStat: plan.stat,
            planNote: plan.note,
            gak: plan.gak,
            mod: plan.mod,
            stat: plan.stat,
            note: plan.note,
            uoc: "", isc: "", riso: ""
          });
        }
      }
      return { wr: wr, name: `SMA Sunny Tripower 125 (WR ${wr})`, strings: strings };
    })
  };
}

// AUTO-SYNC FÜR PARALLELE STRINGS AM SELBEN MPPT
function onModInput(wr, mppt, input, val){
  const partnerInput = (input === '1') ? '2' : '1';
  const partnerId = `${wr}.${mppt}.${partnerInput}`;
  const partnerEl = g('mod-' + partnerId);
  const partnerStat = g('stat-' + partnerId);

  if(partnerEl && partnerStat && partnerStat.value === 'JA'){
    partnerEl.value = val;
    recalcRow(partnerId);
  }
  recalcRow(`${wr}.${mppt}.${input}`);
  queueAutoSync();
}

function setStatus(id, st){
  g('stat-'+id).value = st;
  const ja = g('tja-'+id), nei = g('tnei-'+id);
  if(st === 'JA'){ ja.className = 'tog on-ja'; nei.className = 'tog'; }
  else { nei.className = 'tog on-nei'; ja.className = 'tog'; }
  recalcRow(id);
  queueAutoSync();
}

function recalcRow(id){
  const st = g('stat-'+id).value;
  const mod = parseFloat(g('mod-'+id).value) || 0;
  const row = g('row-'+id);
  const pw = g('pw-'+id);
  const pm = g('pm-'+id);

  if(st === 'NEIN'){
    row.classList.add('row-nein');
    pw.textContent = '—';
    if(pm) pm.textContent = '—';
  } else {
    row.classList.remove('row-nein');
    if(mod > 0){
      pw.textContent = ((mod * PROJECT.modulWp)/1000).toFixed(2) + ' kWp';
      if(pm) pm.textContent = mod;
    } else {
      pw.textContent = '—';
      if(pm) pm.textContent = '—';
    }
  }
  updateKpis();
}

function updateKpis(){
  let totMods = 0, totPwr = 0, totActive = 0, totSlots = 0;

  PROJECT.inverters.forEach(inv => {
    let wrMods = 0, wrPwr = 0;
    inv.strings.forEach(s => {
      totSlots++;
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      const st = g('stat-'+fullId);
      if(st && st.value === 'JA'){
        const mod = parseFloat((g('mod-'+fullId)||{}).value) || 0;
        const pwr = (mod * PROJECT.modulWp) / 1000;
        wrMods += mod; wrPwr += pwr;
        totMods += mod; totPwr += pwr;
        totActive++;
      }
    });
    const wm = g('wr-mod-'+inv.wr), wp = g('wr-pwr-'+inv.wr);
    if(wm) wm.textContent = wrMods;
    if(wp) wp.textContent = wrPwr.toFixed(2) + ' kWp';
  });

  g('d-mods').textContent = totMods;
  g('d-pwr').textContent = totPwr.toFixed(2);
  g('d-act').textContent = totActive;
  g('d-slots').textContent = ` / ${totSlots}`;
}

// ── DIGITALE UNTERSCHRIFTEN LOGIK ──
let padTech, padClient;

class SignaturePad {
  constructor(canvasId){
    this.canvas = g(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.drawing = false;
    this.hasSignature = false;

    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    this.canvas.width = this.canvas.offsetWidth * ratio;
    this.canvas.height = this.canvas.offsetHeight * ratio;
    this.ctx.scale(ratio, ratio);
    this.ctx.lineWidth = 2.5;
    this.ctx.lineCap = 'round';
    this.ctx.lineJoin = 'round';
    this.ctx.strokeStyle = '#0284c7';

    const start = (e) => {
      this.drawing = true;
      const p = this.getPos(e);
      this.ctx.beginPath();
      this.ctx.moveTo(p.x, p.y);
      if(e.cancelable) e.preventDefault();
    };
    const move = (e) => {
      if(!this.drawing) return;
      const p = this.getPos(e);
      this.ctx.lineTo(p.x, p.y);
      this.ctx.stroke();
      this.hasSignature = true;
      if(e.cancelable) e.preventDefault();
    };
    const stop = () => { this.drawing = false; };

    this.canvas.addEventListener('mousedown', start);
    this.canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);

    this.canvas.addEventListener('touchstart', start, { passive: false });
    this.canvas.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', stop);
  }

  getPos(e){
    const rect = this.canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  clear(){
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    this.ctx.clearRect(0, 0, this.canvas.width / ratio, this.canvas.height / ratio);
    this.hasSignature = false;
  }

  toDataURL(){
    return this.hasSignature ? this.canvas.toDataURL('image/png') : '';
  }

  loadDataURL(dataUrl){
    if(!dataUrl) return;
    const img = new Image();
    img.onload = () => {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      this.ctx.drawImage(img, 0, 0, this.canvas.width / ratio, this.canvas.height / ratio);
      this.hasSignature = true;
    };
    img.src = dataUrl;
  }
}

function openSignatureModal(){
  g('modal-signature').style.display = 'flex';
  if(!padTech) padTech = new SignaturePad('sig-canvas-tech');
  if(!padClient) padClient = new SignaturePad('sig-canvas-client');

  if(PROJECT.signatures){
    if(PROJECT.signatures.techName) g('sig-name-tech').value = PROJECT.signatures.techName;
    if(PROJECT.signatures.clientName) g('sig-name-client').value = PROJECT.signatures.clientName;
    if(PROJECT.signatures.techSig) padTech.loadDataURL(PROJECT.signatures.techSig);
    if(PROJECT.signatures.clientSig) padClient.loadDataURL(PROJECT.signatures.clientSig);
  }
}

function closeSignatureModal(){
  g('modal-signature').style.display = 'none';
}

function clearCanvas(id){
  if(id === 'sig-canvas-tech' && padTech) padTech.clear();
  if(id === 'sig-canvas-client' && padClient) padClient.clear();
}

function saveSignatures(){
  const techSig = padTech ? padTech.toDataURL() : (PROJECT.signatures?.techSig || "");
  const clientSig = padClient ? padClient.toDataURL() : (PROJECT.signatures?.clientSig || "");

  PROJECT.signatures = {
    techName: g('sig-name-tech').value.trim() || PROJECT.pruefer,
    techSig: techSig,
    clientName: g('sig-name-client').value.trim() || "Auftraggeber",
    clientSig: clientSig,
    date: new Date().toLocaleDateString('de-AT')
  };

  updatePrintSignatures();
  closeSignatureModal();
  queueAutoSync();
  toast('✍️ Unterschriften gespeichert & synchronisiert');
}

  if(sigs.techSig){

  if(sigs.clientSig){
    imgClient.src = sigs.clientSig;
    imgClient.style.display = 'block';
  } else {
    imgClient.style.display = 'none';
  }

  descTech.textContent = `Datum: ${sigs.date || ''} · Prüfer (${sigs.techName || ''})`;
  descClient.textContent = `Datum: ${sigs.date || ''} · Auftraggeber (${sigs.clientName || ''})`;

  const btnSig = g('btn-sig');
  if(sigs.techSig || sigs.clientSig){
    btnSig.style.background = 'linear-gradient(135deg, #10b981, #047857)';
    btnSig.textContent = '✓ Signiert';
  } else {
    btnSig.style.background = '';
    btnSig.textContent = '✍️ Signieren';
  }
}

// ── SUPABASE MULTI-PROJEKT & CLOUD-ENGINE ──
function initSupabase(){
  if(window.supabase && SB_URL && SB_KEY){
    try {
      supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
      setCloudStatus('online', 'Live mit Supabase');
      loadProjectListFromCloud();
      subscribeRealtime();
      
      clearInterval(auto_sync_interval);
      auto_sync_interval = setInterval(() => {
        pushToCloud();
        fetchCloudProject();
        toast('🔄 120-Minuten Auto-Sync ausgeführt');
      }, 120 * 60 * 1000);

    } catch(e) {
      setCloudStatus('offline', 'Verbindungsfehler');
    }
  }
}

function setCloudStatus(status, text){
  const dot = g('cloud-dot'), txt = g('cloud-text');
  const dotM = g('cloud-dot-m'), txtM = g('cloud-text-m');
  if(txt) txt.textContent = text;
  if(txtM) txtM.textContent = text;

  const dotClass = (status === 'online') ? 'status-dot dot-green' : (status === 'syncing') ? 'status-dot dot-yellow' : 'status-dot dot-red';
  if(dot) dot.className = dotClass;
  if(dotM) dotM.className = dotClass;
}

async function loadProjectListFromCloud(){
  if(!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('pv_projects')
      .select('id, name, updated_at')
      .order('updated_at', { ascending: false });

    if(data && data.length > 0){
      const sel = g('project-dropdown');
      sel.innerHTML = '';
      data.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name || p.id;
        if(p.id === PROJECT.id) opt.selected = true;
        sel.appendChild(opt);
      });
      fetchCloudProject();
    } else {
      pushToCloud();
    }
  } catch(e){}
}

async function switchProject(projId){
  if(!supabaseClient) return;
  toast(`Lade Projekt ${projId}...`);
  try {
    const { data, error } = await supabaseClient
      .from('pv_projects')
      .select('*')
      .eq('id', projId)
      .single();

    if(data){
      const mppts = data.mppts ? data.mppts.split(',').map(Number) : [12,12,12,12,12,12];
      PROJECT = createDefaultProject(data.id, data.name, mppts, data.modul_wp || 465, data.pruefer || '');
      renderMatrix();
      if(data.data) applyRemoteData(data.data);
      toast(`✓ Projekt "${data.name}" geladen`);
    }
  } catch(e){
    toast('Fehler beim Laden des Projekts');
  }
}

async function createNewProject(){
  const name = g('np-name').value.trim();
  if(!name) return toast('Bitte Projektnamen eingeben');
  const tech = g('np-tech').value.trim() || 'Prüfer';
  const modWp = parseFloat(g('np-mod').value) || 465;
  const mpptsRaw = g('np-mppts').value.trim() || '12, 12';
  const mppts = mpptsRaw.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>0);
  const projId = name.replace(/[^a-zA-Z0-9_-]/g, '_');

  PROJECT = createDefaultProject(projId, name, mppts, modWp, tech);
  g('modal-new-project').style.display = 'none';
  renderMatrix();

  await pushToCloud();
  await loadProjectListFromCloud();
  toast(`✓ Neues Projekt "${name}" angelegt`);
}

function queueAutoSync(){
  localStorage.setItem('sp_local_backup', JSON.stringify(collectData()));
  updateKpis();

  if(!supabaseClient) return;
  setCloudStatus('syncing', 'Sync...');
  clearTimeout(sync_timeout);
  sync_timeout = setTimeout(pushToCloud, 500);
}

function collectData(){
  const payload = {
    measurements: {},
    signatures: PROJECT.signatures || {}
  };
  PROJECT.inverters.forEach(inv => {
    inv.strings.forEach(s => {
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      payload.measurements[fullId] = {
        gak: (g('gak-'+fullId)||{}).value || s.gak,
        stat: (g('stat-'+fullId)||{}).value || s.stat,
        mod: (g('mod-'+fullId)||{}).value || s.mod,
        uoc: (g('uoc-'+fullId)||{}).value || '',
        isc: (g('isc-'+fullId)||{}).value || '',
        riso: (g('riso-'+fullId)||{}).value || '',
        note: (g('note-'+fullId)||{}).value || ''
      };
    });
  });
  return payload;
}

async function pushToCloud(){
  if(!supabaseClient) return;
  try {
    const { error } = await supabaseClient
      .from('pv_projects')
      .upsert({
        id: PROJECT.id,
        name: PROJECT.standort,
        pruefer: PROJECT.pruefer,
        modul_wp: PROJECT.modulWp,
        mppts: (PROJECT.mppts||[12,12,12,12,12,12]).join(','),
        data: collectData(),
        updated_at: new Date().toISOString()
      });

    if(!error){
      setCloudStatus('online', 'Live mit Supabase');
    } else {
      setCloudStatus('offline', 'Sync-Fehler');
    }
  } catch(e) {
    setCloudStatus('offline', 'Offline');
  }
}

function saveOnExit(){
  localStorage.setItem('sp_local_backup', JSON.stringify(collectData()));
  const payload = JSON.stringify({
    id: PROJECT.id,
    name: PROJECT.standort,
    pruefer: PROJECT.pruefer,
    modul_wp: PROJECT.modulWp,
    mppts: (PROJECT.mppts||[12,12,12,12,12,12]).join(','),
    data: collectData(),
    updated_at: new Date().toISOString()
  });

  if(window.fetch && SB_URL && SB_KEY){
    fetch(`${SB_URL}/rest/v1/pv_projects`, {
      method: 'POST',
      headers: {
        'apikey': SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: payload,
      keepalive: true
    }).catch(()=>{});
  }
}

async function fetchCloudProject(){
  if(!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('pv_projects')
      .select('*')
      .eq('id', PROJECT.id)
      .single();

    if(data && data.data){
      applyRemoteData(data.data);
    }
  } catch(e) {}
}

function subscribeRealtime(){
  if(!supabaseClient) return;
  supabaseClient
    .channel('pv_projects_realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pv_projects' }, payload => {
      if(payload.new && payload.new.id === PROJECT.id && payload.new.data){
        applyRemoteData(payload.new.data);
        toast('⚡ Live-Update empfangen!');
      }
      loadProjectListFromCloud();
    })
    .subscribe();
}

function applyRemoteData(remoteData){
  const ms = remoteData.measurements || remoteData;
  for(const fullId in ms){
    const row = ms[fullId];
    if(g('gak-'+fullId))  g('gak-'+fullId).value = row.gak;
    if(g('mod-'+fullId))  g('mod-'+fullId).value = row.mod;
    if(g('uoc-'+fullId))  g('uoc-'+fullId).value = row.uoc;
    if(g('isc-'+fullId))  g('isc-'+fullId).value = row.isc;
    if(g('riso-'+fullId)) g('riso-'+fullId).value = row.riso;
    if(g('note-'+fullId)) g('note-'+fullId).value = row.note;
    if(g('stat-'+fullId)) setStatus(fullId, row.stat);
  }

  if(remoteData.signatures){
    PROJECT.signatures = remoteData.signatures;
    updatePrintSignatures();
  }
  updateKpis();
}

function manualSync(){
  pushToCloud();
  fetchCloudProject();
  loadProjectListFromCloud();
  toast('🔄 Synchronisation gestartet');
}

// ── 1. SMARTSCRIPT GAK-PICKERL EXCEL (1 SPALTE, MEHRZEILIG PRO ZELLE) ──
function exportSmartScriptExcel(){
  const rows = [['Etikett']];
  let cnt = 0;

  PROJECT.inverters.forEach(inv => {
    inv.strings.forEach(s => {
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      const st = (g('stat-'+fullId)||{}).value || s.stat;
      if(st !== 'JA') return;

      const mod = parseFloat((g('mod-'+fullId)||{}).value) || s.mod || 0;
      if(mod <= 0) return;

      const gak = (g('gak-'+fullId)||{}).value || s.gak;
      const note = (g('note-'+fullId)||{}).value || s.note || '';
      const pwr = ((mod * PROJECT.modulWp)/1000).toFixed(2).replace('.', ',');

      const labelText = [
        `BVH ${PROJECT.standort}`,
        fullId,
        gak,
        `${mod} Module`,
        `${pwr} kWp`,
        note
      ].filter(Boolean).join('\r\n');

      rows.push([{ t: 's', v: labelText }]);
      cnt++;
    });
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 35 }];

  XLSX.utils.book_append_sheet(wb, ws, 'Etiketten');
  XLSX.writeFile(wb, `SmartScript_GAK-Pickerl_${PROJECT.standort.replace(/\s+/g,'_')}.xlsx`);
  toast(`${cnt} GAK-Pickerl für SmartScript exportiert`);
}

// ── 2. SEPARATE STRING-NUMMERN EXCEL (NUR BELEGTE STRINGS, REINER TEXT) ──
function exportStringNumbersExcel(){
  const rows = [['String']];
  let cnt = 0;

  PROJECT.inverters.forEach(inv => {
    inv.strings.forEach(s => {
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      const st = (g('stat-'+fullId)||{}).value || s.stat;

      if(mod <= 0) return;

  XLSX.utils.book_append_sheet(wb, ws, 'String-Nummern');

// ── 3. KOMPLETTES PRÜFPROTOKOLL EXCEL (TEXTFORMAT FÜR STRINGS) ──
function doExcel(){
  const rows = [
    [{t:'s', v:'String ID (WR.MPPT.In)'}, 'Plan-Soll', 'GAK', 'Status', 'Module', 'Leistung (kWp)', 'Uoc (V)', 'Isc (A)', 'Riso (MOhm)', 'Bemerkung']
  ];

  PROJECT.inverters.forEach(inv => {
    inv.strings.forEach(s => {
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      const st = (g('stat-'+fullId)||{}).value || s.stat;
      const mod = (g('mod-'+fullId)||{}).value || s.mod;
      const pwr = (st === 'JA' && parseFloat(mod) > 0) ? ((parseFloat(mod) * PROJECT.modulWp)/1000).toFixed(2) : '0';
      const gak = (g('gak-'+fullId)||{}).value || s.gak;
      const note = (g('note-'+fullId)||{}).value || s.note || '';
      const planInfo = (s.planStat === 'JA') ? `${s.planMod} Mod (${s.planGak})` : 'Reserve';

      rows.push([
        { t: 's', v: fullId },
        planInfo,
        gak,
        st,
        parseInt(mod) || 0,
        parseFloat(pwr.replace(',','.')) || 0,
        (g('uoc-'+fullId)||{}).value || '',
        (g('isc-'+fullId)||{}).value || '',
        (g('riso-'+fullId)||{}).value || '',
        note
      ]);
    });
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);

  ws['!cols'] = [
    { wch: 18 }, { wch: 18 }, { wch: 12 }, { wch: 10 }, { wch: 10 },
    { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 26 }
  ];

  XLSX.utils.book_append_sheet(wb, ws, 'Prüfprotokoll');
  XLSX.writeFile(wb, `Protokoll_${PROJECT.standort.replace(/\s+/g,'_')}.xlsx`);
  toast('Prüfprotokoll exportiert');
}

// EVENT-LISTENER FÜR SPEICHERN BEIM SCHLIESSEN & AUTO-SYNC
window.onload = () => {
  renderMatrix();
  initSupabase();

  if(localStorage.getItem('solpro_sun_mode') === '1'){
    toggleSunMode();
  }

  window.addEventListener('online', () => {
    toast('📶 Wieder online – synchronisiere...');
    pushToCloud();
  });

  window.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveOnExit();
  });
  window.addEventListener('pagehide', saveOnExit);
  window.addEventListener('beforeunload', saveOnExit);
};
