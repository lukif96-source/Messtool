// ERZEUGT DIE PERFEKTE 144-SLOT MATRIX OHNE FEHLER
function generateStrictState(){
  const result = {};
  [1, 2, 3, 4, 5, 6].forEach(wr => {
    const list = STRICT_CHRONO_PLAN[wr];
    const totalStrings = list.length;
    const doubleCount = Math.max(0, totalStrings - 12); // z.B. 14-12 = 2 Pärchen
    let ptr = 0;

    for(let m = 1; m <= 12; m++){
      if(m <= doubleCount){
        // MPPT ist doppelt belegt: .1 und .2 bekommen STR (ptr+1) und STR (ptr+2)
        const s1 = list[ptr++];
        const s2 = list[ptr++];
        result[`${wr}.${m}.1`] = { planName: `STR ${s1.p}`, gak: `GAK ${wr}.${s1.g}`, mod: s1.m, stat: "JA", note: s1.n || "" };
        result[`${wr}.${m}.2`] = { planName: `STR ${s2.p}`, gak: `GAK ${wr}.${s2.g}`, mod: s2.m, stat: "JA", note: s2.n || "" };
      } else {
        // MPPT ist einzeln belegt: .1 bekommt STR (ptr+1), .2 ist frei
        if(ptr < totalStrings){
          const s1 = list[ptr++];
          result[`${wr}.${m}.1`] = { planName: `STR ${s1.p}`, gak: `GAK ${wr}.${s1.g}`, mod: s1.m, stat: "JA", note: s1.n || "" };
          result[`${wr}.${m}.2`] = { planName: "", gak: `GAK ${wr}.${s1.g}`, mod: 0, stat: "NEIN", note: "" };
        } else {
          result[`${wr}.${m}.1`] = { planName: "", gak: `GAK ${wr}.2`, mod: 0, stat: "NEIN", note: "" };
          result[`${wr}.${m}.2`] = { planName: "", gak: `GAK ${wr}.2`, mod: 0, stat: "NEIN", note: "" };
        }
      }
    }
  });
  return result;
}

let APP_STATE = generateStrictState();

function renderMatrix(remoteOverride){
  if(remoteOverride){
    Object.keys(remoteOverride).forEach(k => {
      if(APP_STATE[k]){
        APP_STATE[k].gak = remoteOverride[k].gak !== undefined ? remoteOverride[k].gak : APP_STATE[k].gak;
        APP_STATE[k].mod = remoteOverride[k].mod !== undefined ? remoteOverride[k].mod : APP_STATE[k].mod;
        APP_STATE[k].stat = remoteOverride[k].stat || APP_STATE[k].stat;
        APP_STATE[k].uoc = remoteOverride[k].uoc || "";
        APP_STATE[k].isc = remoteOverride[k].isc || "";
        APP_STATE[k].riso = remoteOverride[k].riso || "";
        APP_STATE[k].note = remoteOverride[k].note || APP_STATE[k].note;
      }
    });
  }

  const container = g('tables');
  container.innerHTML = '';

  [1, 2, 3, 4, 5, 6].forEach(wr => {
    const bl = document.createElement('div');
    bl.className = 'wr-block';

    let rowsHtml = '';
    for(let m = 1; m <= 12; m++){
      for(let s = 1; s <= 2; s++){
        const fullId = `${wr}.${m}.${s}`;
        const item = APP_STATE[fullId];
        const isMpptDiv = (s === 1 && m > 1);
        const isNein = (item.stat === 'NEIN');
        const pwr = (item.stat === 'JA' && item.mod > 0) ? ((item.mod * MODEL_WP)/1000).toFixed(2) + ' kWp' : '—';
        const planBadge = (item.planName)
          ? `<span class="plan-badge plan-badge-green"><b>${item.planName}</b> · ${item.mod}M · ${item.gak}</span>`
          : `<span class="plan-badge" style="opacity:0.35;">Freier Eingang</span>`;

        rowsHtml += `
          <tr id="row-${fullId}" class="${isMpptDiv ? 'mppt-div' : ''} ${isNein ? 'row-nein' : ''}">
            <td data-label="Klemme" style="padding-left:14px;text-align:left;">
              <span class="string-id">${fullId}</span>
              <span style="font-size:0.62rem;color:#64748b;margin-left:4px;">(M${m}.${s})</span>
            </td>
            <td data-label="Plan-Soll (SLD)" class="no-print" style="text-align:left;">
              ${planBadge}
            </td>
            <td data-label="GAK (Ist)">
              <input type="text" id="gak-${fullId}" value="${item.gak}" class="sp-inp sp-inp-gak" oninput="saveLocal()">
              <span class="print-cell" style="color:#3d5800;">${item.gak}</span>
            </td>
            <td data-label="Aktiv" class="no-print">
              <div class="tog-wrap">
                <button id="tja-${fullId}" class="tog ${item.stat==='JA'?'on-ja':''}" onclick="setStatus('${fullId}','JA')">JA</button>
                <button id="tnei-${fullId}" class="tog ${item.stat==='NEIN'?'on-nei':''}" onclick="setStatus('${fullId}','NEIN')">NEIN</button>
              </div>
              <input type="hidden" id="stat-${fullId}" value="${item.stat}">
            </td>
            <td data-label="Module">
              <input type="number" inputmode="numeric" id="mod-${fullId}" value="${item.mod > 0 ? item.mod : ''}" class="sp-inp" style="width:50px;" oninput="onModInput('${wr}','${m}','${s}',this.value)">
              <span class="print-cell" id="pm-${fullId}">${item.mod > 0 ? item.mod : '—'}</span>
            </td>
            <td data-label="Leistung" class="pwr-cell" id="pw-${fullId}">${pwr}</td>
            <td data-label="Uoc (V)"><input type="text" inputmode="decimal" id="uoc-${fullId}" value="${item.uoc||''}" placeholder="V" class="sp-inp" style="width:60px;" oninput="saveLocal()"></td>
            <td data-label="Isc (A)"><input type="text" inputmode="decimal" id="isc-${fullId}" value="${item.isc||''}" placeholder="A" class="sp-inp" style="width:60px;" oninput="saveLocal()"></td>
            <td data-label="Riso (MΩ)"><input type="text" inputmode="decimal" id="riso-${fullId}" value="${item.riso||''}" placeholder="MΩ" class="sp-inp" style="width:60px;" oninput="saveLocal()"></td>
            <td data-label="Info" class="col-note" style="text-align:left;">
              <input type="text" id="note-${fullId}" value="${item.note||''}" class="sp-inp" style="width:100%;text-align:left;" oninput="saveLocal()">
              <span class="print-cell" style="font-size:7pt;color:#475569;">${item.note||''}</span>
            </td>
          </tr>`;
      }
    }

    bl.innerHTML = `
      <div class="wr-head">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="wr-num">WR ${wr}</span>
          <span style="font-weight:800;font-size:0.88rem;color:#f0f4f8;">SMA Sunny Tripower 125 (WR ${wr})</span>
        </div>
        <div class="wr-kpis">
          <span id="wr-mod-${wr}">0</span> Module &middot; <span id="wr-pwr-${wr}" style="color:#a8cc35;">0.00 kWp</span>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="mt">
          <thead><tr>
            <th style="width:14%;padding-left:14px;text-align:left;">Klemme (WR.M.In)</th>
            <th class="no-print" style="width:15%;text-align:left;">Plan-Soll (Chronologisch)</th>
            <th style="width:9%;">GAK</th>
            <th class="no-print" style="width:8%;">Aktiv</th>
            <th style="width:7%;">Module</th>
            <th style="width:10%;">Leistung</th>
            <th style="width:8%;">Uoc (V)</th>
            <th style="width:8%;">Isc (A)</th>
            <th style="width:8%;">Riso (MΩ)</th>
            <th style="width:14%;text-align:left;">Bemerkung</th>
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>`;
    container.appendChild(bl);
  });

  updateKpis();
}

function onModInput(wr, mppt, input, val){
  const partnerInput = (input === '1') ? '2' : '1';
  const partnerId = `${wr}.${mppt}.${partnerInput}`;
  const partnerStat = g('stat-' + partnerId);
  const partnerEl = g('mod-' + partnerId);

  // Parallele Doppelbelegung automatisch synchronisieren
  if(partnerEl && partnerStat && partnerStat.value === 'JA'){
    partnerEl.value = val;
    recalcRow(partnerId);
  }
  recalcRow(`${wr}.${mppt}.${input}`);
  saveLocal();
}

function setStatus(id, st){
  g('stat-'+id).value = st;
  const ja = g('tja-'+id), nei = g('tnei-'+id);
  if(st === 'JA'){ ja.className = 'tog on-ja'; nei.className = 'tog'; }
  else { nei.className = 'tog on-nei'; ja.className = 'tog'; }
  recalcRow(id);
  saveLocal();
}

function recalcRow(id){
  const st = g('stat-'+id).value;
  const mod = parseFloat(g('mod-'+id).value) || 0;
  const row = g('row-'+id);
  const pw = g('pw-'+id);
  const pm = g('pm-'+id);

  if(st === 'NEIN'){
    row.classList.add('row-nein');
    pw.textContent = '—';
    if(pm) pm.textContent = '—';
  } else {
    row.classList.remove('row-nein');
    if(mod > 0){
      pw.textContent = ((mod * MODEL_WP)/1000).toFixed(2) + ' kWp';
      if(pm) pm.textContent = mod;
    } else {
      pw.textContent = '—';
      if(pm) pm.textContent = '—';
    }
  }
  updateKpis();
}

function updateKpis(){
  let totMods = 0, totPwr = 0, totActive = 0;

  for(let wr = 1; wr <= 6; wr++){
    let wrM = 0, wrP = 0;
    for(let m = 1; m <= 12; m++){
      for(let s = 1; s <= 2; s++){
        const fullId = `${wr}.${m}.${s}`;
        const st = g('stat-'+fullId);
        if(st && st.value === 'JA'){
          const mod = parseFloat((g('mod-'+fullId)||{}).value) || 0;
          const pwr = (mod * MODEL_WP) / 1000;
          wrM += mod; wrP += pwr;
          totMods += mod; totPwr += pwr;
          if(mod > 0) totActive++;
        }
      }
    }
    const wm = g(`wr-mod-${wr}`), wp = g(`wr-pwr-${wr}`);
    if(wm) wm.textContent = wrM;
    if(wp) wp.textContent = wrP.toFixed(2) + ' kWp';
  }

  g('d-mods').textContent = totMods;
  g('d-pwr').textContent = totPwr.toFixed(2);
  g('d-act').textContent = totActive;
}

function saveLocal(){
  const payload = collectData();
  localStorage.setItem('sp_local_backup_chrono', JSON.stringify(payload));
}

function collectData(){
  const payload = {};
  for(let wr = 1; wr <= 6; wr++){
    for(let m = 1; m <= 12; m++){
      for(let s = 1; s <= 2; s++){
        const fullId = `${wr}.${m}.${s}`;
        payload[fullId] = {
          gak: (g('gak-'+fullId)||{}).value || "",
          stat: (g('stat-'+fullId)||{}).value || "NEIN",
          mod: parseFloat((g('mod-'+fullId)||{}).value) || 0,
          uoc: (g('uoc-'+fullId)||{}).value || "",
          isc: (g('isc-'+fullId)||{}).value || "",
          riso: (g('riso-'+fullId)||{}).value || "",
          note: (g('note-'+fullId)||{}).value || ""
        };
      }
    }
  }
  return payload;
}

// ── MANUELLER CLOUD SYNC: NUR AUF KNOPFDRUCK! ──
async function pushCloudDataManually(){
  if(!supabaseClient) return toast('Keine Cloud-Verbindung konfiguriert');
  toast('☁️ Lade Daten in Supabase hoch...');
  try {
    const { error } = await supabaseClient.from('pv_projects').upsert({
      id: PROJECT_ID,
      name: "PV MAN P52",
      pruefer: "Christoph Huber / Sven",
      modul_wp: MODEL_WP,
      mppts: "12,12,12,12,12,12",
      data: collectData(),
      updated_at: new Date().toISOString()
    });
    if(!error){
      saveLocal();
      toast('✅ Daten erfolgreich in Supabase gespeichert!');
    } else {
      toast('Fehler beim Speichern in Cloud');
    }
  } catch(e) { toast('Verbindungsfehler zur Cloud'); }
}

async function fetchCloudDataManually(){
  if(!supabaseClient) return toast('Keine Cloud-Verbindung');
  toast('📥 Lade aktuellen Stand aus Cloud...');
  try {
    const { data, error } = await supabaseClient
      .from('pv_projects')
      .select('*')
      .eq('id', PROJECT_ID)
      .single();

    if(data && data.data){
      renderMatrix(data.data);
      saveLocal();
      toast('✅ Stand aus Cloud erfolgreich geladen');
    } else {
      toast('Cloud-Eintrag ist noch leer.');
    }
  } catch(e) { toast('Fehler beim Abrufen aus Cloud'); }
}

async function factoryResetCloud(){
  if(!confirm("Achtung: Dies setzt den Plan 'PV MAN P52' auf die saubere chronologische 12-MPPT-Matrix zurück und überschreibt die alten Cloud-Daten. Fortfahren?")) return;
  localStorage.removeItem('sp_local_backup_chrono');
  APP_STATE = generateStrictState();
  renderMatrix(null);
  await pushCloudDataManually();
  toast('✅ Plan sauber zurückgesetzt und in Cloud fixiert!');
}

// ── EXPORT FUNKTIONEN (SmartScript & Excel) ──
function exportSmartScriptExcel(){
  const rows = [['Etikett']];
  let cnt = 0;

  for(let wr = 1; wr <= 6; wr++){
    for(let m = 1; m <= 12; m++){
      for(let s = 1; s <= 2; s++){
        const fullId = `${wr}.${m}.${s}`;
        const st = (g('stat-'+fullId)||{}).value || APP_STATE[fullId].stat;
        if(st !== 'JA') continue;

        const mod = parseFloat((g('mod-'+fullId)||{}).value) || APP_STATE[fullId].mod || 0;
        if(mod <= 0) continue;

        const gak = (g('gak-'+fullId)||{}).value || APP_STATE[fullId].gak;
        const note = (g('note-'+fullId)||{}).value || APP_STATE[fullId].note || '';
        const pwr = ((mod * MODEL_WP)/1000).toFixed(2).replace('.', ',');

        const labelText = [
          `BVH PV MAN P52`,
          fullId,
          gak,
          `${mod} Module`,
          `${pwr} kWp`,
          note
        ].filter(Boolean).join('\r\n');

        rows.push([{ t: 's', v: labelText }]);
        cnt++;
      }
    }
  }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 35 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Etiketten');
  XLSX.writeFile(wb, `SmartScript_GAK-Pickerl_PV_MAN_P52.xlsx`);
  toast(`${cnt} GAK-Pickerl exportiert`);
}

        const item = APP_STATE[fullId];
        const st = (g('stat-'+fullId)||{}).value || item.stat;
        const mod = (g('mod-'+fullId)||{}).value || item.mod;
        const pwr = (st === 'JA' && parseFloat(mod) > 0) ? ((parseFloat(mod) * MODEL_WP)/1000).toFixed(2) : '0';

  toast('Prüfprotokoll exportiert');
}

  renderMatrix(localCache && Object.keys(localCache).length > 5 ? localCache : null);
