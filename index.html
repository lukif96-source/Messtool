@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --bg: #05080f;
  --surface: #0c1220;
  --panel: #111827;
  --border: rgba(255,255,255,0.08);
  --green: #9fc131;
  --text: #f0f4f8;
  --muted: #64748b;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1280px; margin: 0 auto; padding: 16px 16px 100px; }

/* DASHBOARD */
.dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 768px){ .dashboard { grid-template-columns: repeat(2, 1fr); } }
.kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; position: relative; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--green), transparent); }
.kpi-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.kpi-value { font-size: 1.55rem; font-weight: 900; color: var(--text); line-height: 1; }
.kpi-unit { font-size: 0.75rem; color: var(--green); margin-left: 3px; }

/* TOOLBAR */
#toolbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(17,24,39,0.94); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 16px; flex-wrap: wrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: 'Inter', sans-serif; font-weight: 700; cursor: pointer; border: none;
  border-radius: 10px; padding: 8px 14px; font-size: 0.8rem; transition: all 0.15s;
}
.btn-green { background: linear-gradient(135deg, #a8cc35, #7a9420); color: #061200; font-weight: 900; }
.btn-blue  { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
.btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; }
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* CLOUD STATUS BADGE */
.cloud-badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 700;
  padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-green  { background: #a8cc35; box-shadow: 0 0 8px #a8cc35; }
.dot-yellow { background: #eab308; box-shadow: 0 0 8px #eab308; }
.dot-red    { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

/* WR BLOCK & TABLES */
.wr-block { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
.wr-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 18px; background: linear-gradient(135deg, rgba(159,193,49,0.08) 0%, transparent 60%);
  border-bottom: 1px solid rgba(159,193,49,0.15); flex-wrap: wrap;
}
.wr-title-wrap { display: flex; align-items: center; gap: 10px; }
.wr-num { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 700; background: var(--green); color: #061200; padding: 2px 8px; border-radius: 6px; }
.wr-name { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.wr-kpis { font-size: 0.75rem; color: var(--muted); font-weight: 600; }

table.mt { width: 100%; border-collapse: collapse; }
table.mt thead th {
  padding: 8px 6px; font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
  color: #64748b; background: rgba(0,0,0,0.25); text-align: center; white-space: nowrap;
}
table.mt td { padding: 6px 6px; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; vertical-align: middle; }
table.mt tbody tr:hover { background: rgba(159,193,49,0.03); }
table.mt tbody tr.mppt-div { border-top: 1.5px solid rgba(159,193,49,0.18); }
table.mt tbody tr.row-nein { opacity: 0.22; }

.string-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--green); }
.pwr-cell { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--green); }

.sp-inp {
  background: rgba(5,8,15,0.8); border: 1px solid rgba(100,116,139,0.25);
  border-radius: 6px; padding: 4px 6px; color: var(--text); font-size: 0.8rem; text-align: center; outline: none;

.sp-inp:focus { border-color: var(--green); }
.sp-inp-gak { color: #a8cc35; font-weight: 700; font-family: 'JetBrains Mono', monospace; width: 75px; }

/* TOGGLE */
.tog-wrap { display: inline-flex; background: rgba(0,0,0,0.4); border-radius: 6px; padding: 2px; }
.tog { padding: 2px 7px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; border: none; cursor: pointer; background: transparent; color: #475569; }
.tog.on-ja  { background: rgba(159,193,49,0.25); color: #a8cc35; }
.tog.on-nei { background: rgba(100,116,139,0.25); color: #94a3b8; }

#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120%);
  background: #0f172a; border: 1px solid var(--green); color: #fff; padding: 10px 20px;
  border-radius: 10px; font-size: 0.85rem; font-weight: 600; transition: transform 0.3s; z-index: 9999;

#toast.show { transform: translateX(-50%) translateY(0); }

/* PRINT */
@media print {
  body { background: #fff !important; color: #000 !important; font-size: 8pt; }
  .no-print { display: none !important; }
  .wr-block { break-inside: avoid-page; border: 1px solid #cbd5e1 !important; margin-bottom: 10px; }
  .wr-head { background: #f1f5f9 !important; color: #000 !important; }
  table.mt th { background: #e2e8f0 !important; color: #000 !important; border: 1px solid #94a3b8; }
  table.mt td { border: 1px solid #cbd5e1 !important; color: #000 !important; }
  table.mt tbody tr.row-nein { display: none !important; } /* Unbelegte Strings beim Drucken ausblenden */
  .sp-inp, .tog-wrap { display: none !important; }
  .print-cell { display: inline !important; font-weight: 700 !important; }
}

      lastMppt = s.mppt;
      const isNein = (s.stat === 'NEIN');
      const pwr = (s.stat === 'JA' && s.mod > 0) ? ((s.mod * PROJECT.modulWp)/1000).toFixed(2) + ' kWp' : '—';

      rows += `
        <tr id="row-${fullId}" class="${isMpptDiv ? 'mppt-div' : ''} ${isNein ? 'row-nein' : ''}">
          <td style="text-align:left;padding-left:14px;">
            <span class="string-id">${fullId}</span>
            <span style="font-size:0.65rem;color:#64748b;margin-left:4px;">(MPPT ${s.mppt}.${s.in})</span>
          </td>
          <td>
            <input type="text" id="gak-${fullId}" value="${s.gak}" class="sp-inp sp-inp-gak" oninput="queueAutoSync()">
            <span class="print-cell" style="color:#3d5800;">${s.gak}</span>
          </td>
          <td class="no-print">
            <div class="tog-wrap">
              <button id="tja-${fullId}" class="tog ${s.stat==='JA'?'on-ja':''}" onclick="setStatus('${fullId}','JA')">JA</button>
              <button id="tnei-${fullId}" class="tog ${s.stat==='NEIN'?'on-nei':''}" onclick="setStatus('${fullId}','NEIN')">NEIN</button>
            </div>
            <input type="hidden" id="stat-${fullId}" value="${s.stat}">
          </td>
          <td>
            <input type="number" id="mod-${fullId}" value="${s.mod}" class="sp-inp" style="width:52px;" oninput="onModInput('${inv.wr}','${s.mppt}','${s.in}',this.value)">
            <span class="print-cell" id="pm-${fullId}">${s.mod > 0 ? s.mod : '—'}</span>
          </td>
          <td class="pwr-cell" id="pw-${fullId}">${pwr}</td>
          <td><input type="text" id="uoc-${fullId}" value="${s.uoc||''}" placeholder="V" class="sp-inp" style="width:65px;" oninput="queueAutoSync()"></td>
          <td><input type="text" id="isc-${fullId}" value="${s.isc||''}" placeholder="A" class="sp-inp" style="width:65px;" oninput="queueAutoSync()"></td>
          <td><input type="text" id="riso-${fullId}" value="${s.riso||''}" placeholder="MΩ" class="sp-inp" style="width:65px;" oninput="queueAutoSync()"></td>
          <td style="text-align:left;">
            <input type="text" id="note-${fullId}" value="${s.note||''}" class="sp-inp" style="width:100%;text-align:left;color:#94a3b8;" oninput="queueAutoSync()">
            <span class="print-cell" style="font-size:7pt;color:#475569;">${s.note||''}</span>
          </td>
        </tr>`;
    });

    bl.innerHTML = `
      <div class="wr-head">
        <div class="wr-title-wrap">
          <span class="wr-num">WR ${inv.wr}</span>
          <span class="wr-name">${inv.name}</span>
        </div>
        <div class="wr-kpis">
          <span id="wr-mod-${inv.wr}">0</span> Module &middot; <span id="wr-pwr-${inv.wr}" style="color:#a8cc35;">0.00 kWp</span>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="mt">
          <thead><tr>
            <th style="width:16%;text-align:left;padding-left:14px;">String ID (WR.MPPT.In)</th>
            <th style="width:10%;">GAK</th>
            <th class="no-print" style="width:8%;">Aktiv</th>
            <th style="width:8%;">Module</th>
            <th style="width:11%;">Leistung</th>
            <th style="width:9%;">Uoc (V)</th>
            <th style="width:9%;">Isc (A)</th>
            <th style="width:9%;">Riso (MΩ)</th>
            <th style="width:20%;text-align:left;">Bemerkung</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    cont.appendChild(bl);
  });

  updateKpis();
}

// AUTO-SYNC FÜR PARALLELE STRINGS AM SELBEN MPPT
function onModInput(wr, mppt, input, val){
  const partnerInput = (input === '1') ? '2' : '1';
  const partnerId = `${wr}.${mppt}.${partnerInput}`;
  const partnerEl = g('mod-' + partnerId);
  const partnerStat = g('stat-' + partnerId);

  if(partnerEl && partnerStat && partnerStat.value === 'JA'){
    partnerEl.value = val;
    recalcRow(partnerId);
  }
  recalcRow(`${wr}.${mppt}.${input}`);
  queueAutoSync();
}

function setStatus(id, st){
  g('stat-'+id).value = st;
  const ja = g('tja-'+id), nei = g('tnei-'+id);
  if(st === 'JA'){ ja.className = 'tog on-ja'; nei.className = 'tog'; }
  else { nei.className = 'tog on-nei'; ja.className = 'tog'; }
  recalcRow(id);
  queueAutoSync();
}

function recalcRow(id){
  const st = g('stat-'+id).value;
  const mod = parseFloat(g('mod-'+id).value) || 0;
  const row = g('row-'+id);
  const pw = g('pw-'+id);
  const pm = g('pm-'+id);

  if(st === 'NEIN'){
    row.classList.add('row-nein');
    pw.textContent = '—';
    if(pm) pm.textContent = '—';
  } else {
    row.classList.remove('row-nein');
    if(mod > 0){
      pw.textContent = ((mod * PROJECT.modulWp)/1000).toFixed(2) + ' kWp';
      if(pm) pm.textContent = mod;
    } else {
      pw.textContent = '—';
      if(pm) pm.textContent = '—';
    }
  }
  updateKpis();
}

function updateKpis(){
  let totMods = 0, totPwr = 0, totActive = 0;

  PROJECT.inverters.forEach(inv => {
    let wrMods = 0, wrPwr = 0;
    inv.strings.forEach(s => {
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      const st = g('stat-'+fullId);
      if(st && st.value === 'JA'){
        const mod = parseFloat((g('mod-'+fullId)||{}).value) || 0;
        const pwr = (mod * PROJECT.modulWp) / 1000;
        wrMods += mod; wrPwr += pwr;
        totMods += mod; totPwr += pwr;
        totActive++;
      }
    });
    const wm = g('wr-mod-'+inv.wr), wp = g('wr-pwr-'+inv.wr);
    if(wm) wm.textContent = wrMods;
    if(wp) wp.textContent = wrPwr.toFixed(2) + ' kWp';
  });

  g('d-mods').textContent = totMods;
  g('d-pwr').textContent = totPwr.toFixed(2);
  g('d-act').textContent = totActive;
}

// ── SUPABASE CLOUD SYNC ENGINE ──
function initSupabase(){
  if(window.supabase && SB_URL && SB_KEY){
    try {
      supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
      setCloudStatus('online', 'Live mit Supabase');
      subscribeRealtime();
      fetchCloudProject();
    } catch(e) {
      setCloudStatus('offline', 'Verbindungsfehler');
    }
  } else {
    setCloudStatus('offline', 'Lokal');
  }
}

function setCloudStatus(status, text){
  const dot = g('cloud-dot'), txt = g('cloud-text');
  txt.textContent = text;
  if(status === 'online'){ dot.className = 'status-dot dot-green'; }
  else if(status === 'syncing'){ dot.className = 'status-dot dot-yellow'; }
  else { dot.className = 'status-dot dot-red'; }
}

function queueAutoSync(){
  localStorage.setItem('sp_local_backup', JSON.stringify(collectData()));
  updateKpis();

  if(!supabaseClient) return;
  setCloudStatus('syncing', 'Synchronisiere...');
  clearTimeout(sync_timeout);
  sync_timeout = setTimeout(pushToCloud, 500);
}

function collectData(){
  const payload = {};
  PROJECT.inverters.forEach(inv => {
    inv.strings.forEach(s => {
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      payload[fullId] = {
        gak: (g('gak-'+fullId)||{}).value || s.gak,
        stat: (g('stat-'+fullId)||{}).value || s.stat,
        mod: (g('mod-'+fullId)||{}).value || s.mod,
        uoc: (g('uoc-'+fullId)||{}).value || '',
        isc: (g('isc-'+fullId)||{}).value || '',
        riso: (g('riso-'+fullId)||{}).value || '',
        note: (g('note-'+fullId)||{}).value || ''
      };
    });
  });
  return payload;
}

async function pushToCloud(){
  if(!supabaseClient) return;
  try {
    const { error } = await supabaseClient
      .from('pv_projects')
      .upsert({
        id: PROJECT.id,
        name: PROJECT.standort,
        pruefer: PROJECT.pruefer,
        modul_wp: PROJECT.modulWp,
        data: collectData(),
        updated_at: new Date().toISOString()
      });

    if(!error){
      setCloudStatus('online', 'Live mit Supabase');
    } else {
      setCloudStatus('offline', 'Sync-Fehler');
    }
  } catch(e) {
    setCloudStatus('offline', 'Offline');
  }
}

async function fetchCloudProject(){
  if(!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('pv_projects')
      .select('*')
      .eq('id', PROJECT.id)
      .single();

    if(data && data.data){
      applyRemoteData(data.data);
      toast('☁️ Live-Daten aus Supabase geladen');
    } else {
      pushToCloud();
    }
  } catch(e) {}
}

function subscribeRealtime(){
  if(!supabaseClient) return;
  supabaseClient
    .channel('pv_projects_realtime')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pv_projects', filter: `id=eq.${PROJECT.id}` }, payload => {
      if(payload.new && payload.new.data){
        applyRemoteData(payload.new.data);
        toast('⚡ Live-Update von Sven empfangen!');
      }
    })
    .subscribe();
}

function applyRemoteData(remoteData){
  for(const fullId in remoteData){
    const row = remoteData[fullId];
    if(g('gak-'+fullId))  g('gak-'+fullId).value = row.gak;
    if(g('mod-'+fullId))  g('mod-'+fullId).value = row.mod;
    if(g('uoc-'+fullId))  g('uoc-'+fullId).value = row.uoc;
    if(g('isc-'+fullId))  g('isc-'+fullId).value = row.isc;
    if(g('riso-'+fullId)) g('riso-'+fullId).value = row.riso;
    if(g('note-'+fullId)) g('note-'+fullId).value = row.note;
    if(g('stat-'+fullId)) setStatus(fullId, row.stat);
  }
  updateKpis();
}

function manualSync(){
  pushToCloud();
  fetchCloudProject();
  toast('🔄 Synchronisation gestartet');
}

// ── SMARTSCRIPT CSV & EXCEL EXPORT ──
function exportGakPickerl(){
  const rows = [['BVH', 'String', 'GAK', 'Module', 'Leistung']];
  let cnt = 0;

  PROJECT.inverters.forEach(inv => {
    inv.strings.forEach(s => {
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      const st = g('stat-'+fullId);
      if(!st || st.value !== 'JA') return; // Unbelegte ("NEIN") nicht exportieren

      const mod = parseFloat((g('mod-'+fullId)||{}).value) || 0;
      if(mod <= 0) return;

      const gak = (g('gak-'+fullId)||{}).value || s.gak;
      const pwr = ((mod * PROJECT.modulWp)/1000).toFixed(2).replace('.', ',');

      rows.push([PROJECT.standort, fullId, gak, mod + ' Module', pwr + ' kWp']);
      cnt++;
    });
  });

  const csv = rows.map(r => r.join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `GAK-Pickerl_${PROJECT.standort.replace(/\s+/g,'_')}.csv`;
  a.click();
  toast(cnt + ' GAK-Pickerl exportiert');
}

function doExcel(){
  const rows = [['String ID (WR.MPPT.In)', 'GAK', 'Status', 'Module', 'Leistung (kWp)', 'Uoc (V)', 'Isc (A)', 'Riso (MOhm)', 'Bemerkung']];
  PROJECT.inverters.forEach(inv => {
    inv.strings.forEach(s => {
      const fullId = `${inv.wr}.${s.mppt}.${s.in}`;
      const st = (g('stat-'+fullId)||{}).value || 'JA';
      const mod = (g('mod-'+fullId)||{}).value || '0';
      const pwr = (st === 'JA' && parseFloat(mod) > 0) ? ((parseFloat(mod) * PROJECT.modulWp)/1000).toFixed(2) : '0';
      const gak = (g('gak-'+fullId)||{}).value || '';
      rows.push([fullId, gak, st, mod, pwr, (g('uoc-'+fullId)||{}).value||'', (g('isc-'+fullId)||{}).value||'', (g('riso-'+fullId)||{}).value||'', (g('note-'+fullId)||{}).value||'']);
    });
  });
  const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Prüfprotokoll');
  XLSX.writeFile(wb, `Protokoll_${PROJECT.standort.replace(/\s+/g,'_')}.xlsx`);
  toast('Excel exportiert');
}

window.onload = () => {
  renderMatrix();
  initSupabase();

  window.addEventListener('online', () => {
    toast('📶 Wieder online – synchronisiere...');
    pushToCloud();
  });
};
</script>
